  /Senders/Resolve:
    parameters: []
    post:
      summary: Resolve Senders
      description: This operation resolves a list of eligible Senders for sending and receiving communications for the given criteria.
      operationId: ResolveSenders
      tags:
        - Senders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ResolveSendersRequest
              type: object
              oneOf:
                - title: ResolveSendersFromSenderPoolRequest
                  type: object
                  properties:
                    senderPoolId:
                      $ref: '#/components/schemas/SenderPoolId'
                      description: The ID of the Sender Pool to use when resolving Sender-Recipient pairs. When a Sender Pool is specified it will constrain the potential results based upon which Senders are members of the pool.
                    recipientAddresses:
                      title: ResolveSendersFromSenderPoolRequestRecipientAddresses
                      description: A collection of addresses for a single human used to resolve Senders.
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/CommunicationRecipient'
                    channels:
                      $ref: '#/components/schemas/SenderCommunicationChannelControl'
                  required:
                    - recipientAddresses
                - title: ResolveSendersFromAddressesRequest
                  type: object
                  properties:
                    recipientAddresses:
                      title: ResolveSendersFromAddressesRequestRecipientAddresses
                      description: A collection of addresses for a single human used to resolve Senders.
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/CommunicationRecipient'
                    senderAddresses:
                      oneOf:
                        - $ref: '#/components/schemas/MessageAddressSender'
                        - $ref: '#/components/schemas/EmailAddressSender'
                        - $ref: '#/components/schemas/PushNotificationCredentialSender'
                    channels:
                      $ref: '#/components/schemas/SenderCommunicationChannelControl'
                  required:
                    - recipientAddresses
                    - senderAddresses
            examples:
              MultipleAddresses:
                summary: Multiple Addresses
                value:
                  recipientAddresses:
                    - address: '+14153902337'
                      channel: PHONE
                    - address: '+14153902337'
                      channel: WHATSAPP
                    - address: davidpletnjov@example.com
                      channel: EMAIL
              UsingASenderPool:
                summary: Using a Sender Pool
