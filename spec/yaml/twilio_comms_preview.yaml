                  recipientAddresses:
                    - address: '+14153902337'
                      channel: PHONE
                    - address: '+14153902337'
                      channel: WHATSAPP
                    - address: davidpletnjov@example.com
                      channel: EMAIL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ResolveSendersResponse
                type: object
                properties:
                  results:
                    title: ResolveSendersResponseResults
                    description: An array of compatible Sender-Recipient pairs to communicate `from` and `to`. Limited to the top 10 highest priority results.
                    type: array
                    items:
                      title: ResolveSendersResponseResult
                      type: object
                      description: A Sender-Recipient pair to communicate `from` and `to`.
                      properties:
                        from:
                          title: ResolveSendersResponsePairFrom
                          type: object
                          description: The Sender that is eligible to communicate with the recipient endpoint in the `to` field.
                          properties:
                            senderId:
                              $ref: '#/components/schemas/SenderId'
                            displayName:
                              type:
                                - string
                                - 'null'
                              description: The name to associate with the address for sending and receiving communications, visible in the from for some types of communications, like email.
                            address:
                              type: string
                              description: The Sender’s communication address within a channel, such as a phone number, email address, or device token.
                            channel:
                              $ref: '#/components/schemas/SenderCommunicationChannel'
                          required:
                            - senderId
                            - displayName
                            - channel
                        to:
