    get:
      summary: List Messages
      operationId: ListMessages
      description: This operation fetches a paginated list of Messages.
      tags:
        - Messages
      parameters:
        - in: query
          name: operationId
          description: Filter Messages by Operation ID.
          schema:
            $ref: '#/components/schemas/OperationId'
        - in: query
          name: sessionId
          description: Filter Messages by Session ID.
          schema:
            $ref: '#/components/schemas/SessionId'
        - in: query
          name: startDate
          description: Filter to Messages created after the specified date and time in ISO 8601 format. The date is in RFC3339 format. (e.g., 2025-06-18T12:00:00Z)
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          description: Filter to Messages created before the specified date and time in ISO 8601 format. The date is in RFC3339 format and must be greater  than startDate if provided. (e.g., 2025-06-18T12:00:00Z)
          schema:
            type: string
            format: date-time
        - in: query
          name: profile
          description: Filter Messages sent or received by Profile ID.
          schema:
            $ref: '#/components/schemas/ProfileId'
        - in: query
          name: channel
          description: Filter Messages by channel.
          schema:
            $ref: '#/components/schemas/MessageSenderChannel'
        - in: query
          name: status
          description: Filter Messages by Delivery Status.
          schema:
            $ref: '#/components/schemas/MessageStatus'
        - in: query
          name: tags
