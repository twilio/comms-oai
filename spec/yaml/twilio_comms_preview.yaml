components:
  securitySchemes:
    account_id_auth_token:
      type: http
      scheme: basic
      description: Basic authentication of the form `Basic <account_id:auth_token>`.
    api_key_api_key_secret:
      type: http
      scheme: basic
      description: Basic authentication of the form `Basic <api_key:api_key_secret>`.
  schemas:
    OperationId:
      description: An identifier used to group and retrieve resources that were created together in the same request. This can be used for convenient retrieval of correlated resources and their aggregates.
      title: OperationId
      type: string
      pattern: ^comms_operation_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_operation_01h9krwprkeee8fzqspvwy6nq8
    ContactId:
      description: A reference to a Contact.
      title: ContactId
      type: string
      pattern: ^comms_contact_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_contact_01h9krwprkeee8fzqspvwy6nq8
    PageToken:
      description: The token that identifies the page of resources to fetch.
      title: PageToken
      type: string
    PageSize:
      description: Total number of items returned in a single page, the minimum is 1 and maximum is 1000. Default is 50.
      title: PageSize
      type: integer
      minimum: 1
      maximum: 1000
      default: 50
      example: 50
    TagsString:
      title: TagsString
      type: string
      description: |-
        Custom metadata in the form of key-value pairs.
        Must be in the key value format: key1:value;key2:value;

        Example:
        ```json
        {
          "key1":"value1",
          "key2":"value2"
        }
        ```

        Should be inputted as:
        ```
        ?tags=key1:value;key2:value;
        ```
      pattern: ^(?:[a-zA-Z0-9._~-]+:[a-zA-Z0-9._~-]+;){1,10}$
      example: key_1:value;key_2:value;
    UserIdentifier:
      title: UserIdentifier
      type: string
      description: |-
        A custom string that uniquely identifies a person or end-user.
        For example, this can be the end-user's username or a UUID4 string or an SHA256 hash.
      minLength: 1
      maxLength: 36
    ContactLocation:
      type: object
      title: ContactLocation
      description: The physical geo-location of the Contact.
      properties:
        latitude:
          description: |-
            The latitude coordinate of the Contact's location in decimal degrees.
            Positive values indicate locations north of the equator.
          type: number
          format: float
        longitude:
          description: |-
            The longitude coordinate of the Contact's location in decimal degrees.
            Positive values indicate locations east of the prime meridian.
          type: number
          format: float
        address_line_1:
          description: Contact's first address line.
          type: string
        address_line_2:
          description: Contact's second address line.
          type: string
        city:
          description: Contact's city.
          type: string
        state:
          description: Contact's state.
          type: string
        postal_code:
          description: Contact's postal zip code.
          type: string
        country_code:
          description: Contact's ISO 3166-1 alpha-2 country code.
          type: string
          format: iso-country-code
          pattern: ^[A-Z]{2}$
          example: US
    ContactIdentity:
      title: ContactIdentity
      type: object
      description: An Identity is the schema of a person or user.
      properties:
        first_name:
          type: string
          description: The first name of the Contact.
        last_name:
          type: string
          description: The last name of the Contact.
        display_name:
          type: string
          description: The name associated with the address for sending and receiving communications, visible for some types of communications like email.
        user_identifier:
          $ref: '#/components/schemas/UserIdentifier'
        location:
          $ref: '#/components/schemas/ContactLocation'
        date_of_birth:
          description: Contact's date of birth.
          format: YYYY-MM-DD
          type: string
    Address:
      title: Address
      type: string
      description: The identifier that uniquely addresses a user within a communications channel.
    ContactCommunicationChannel:
      title: ContactCommunicationChannel
      description: |-
        The medium which a unit of communication is transmitted through.
        These are differentiated by a mix of transmission protocol, network controller/owner, endpoint and address model,
        as well as the model for content of the atomic unit of communication itself.
      type: string
      enum:
        - email
        - phone
        - whatsapp
        - push
    ContactAddress:
      type: object
      title: ContactAddress
      properties:
        address:
          $ref: '#/components/schemas/Address'
        channel:
          $ref: '#/components/schemas/ContactCommunicationChannel'
      required:
        - address
        - channel
    ExternalIdentifier:
      title: ExternalIdentifier
      description: An external identifier is a unique identifier for a Contact in an external system, such as a CRM or CDP.
      type: string
    ContactFieldValue:
      title: ContactFieldValue
      description: |-
        A custom field value for Contacts.
        This field can be used to store various types of values such as strings, booleans, numbers, or arrays.
      type: object
      properties:
        value: {}
      required:
        - value
    ContactCustomFields:
      title: ContactCustomFields
      type: object
      description: |-
        Custom fields in the form of key-value pairs.
        Maximum size of a custom field key is 128 characters.
        Maximum size of a custom field is 256 characters.
        There can be a maximum of 10 custom fields.
      additionalProperties:
        $ref: '#/components/schemas/ContactFieldValue'
      maxProperties: 10
      example:
        favorite_color:
          value: purple
        favorite_number:
          value: 42
        is_favorite_color_purple:
          value: true
        colors:
          value:
            - purple
            - blue
            - green
    Tags:
      title: Tags
      type: object
      description: |-
        Custom metadata in the form of key-value pairs.
        Maximum size of a tag key is 128 characters.
        Maximum size of a tag value is 256 characters.
        There can be a maximum of 10 key-value pairs.

        This field can be templated with [Liquid](https://shopify.github.io/liquid/).
        Specify `variables` with each recipient for personalization 
        and `default_variables` for default values.
      maxProperties: 10
      propertyNames:
        type: string
        maxLength: 128
        pattern: ^[a-zA-Z0-9._~-]+$
      additionalProperties:
        type: string
        maxLength: 256
        pattern: ^[a-zA-Z0-9._~-]+$
    RelatedResource:
      title: RelatedResource
      type: object
      description: A reference to a related resource.
      properties:
        name:
          type: string
          description: The name of the related resource.
          enum:
            - email
            - message
            - push_notification
            - session
            - contact
            - audience
            - media
            - agent
            - agent_pool
            - operation
            - engagement
            - credential
            - push_notification_app
        id:
          description: The identifier of the related resource.
          type: string
        uri:
          description: The path to the related resource.
          type: string
    Contact:
      title: Contact
      type: object
      description: |-
        A Contact represents a person or entity to communicate with.
        It is composed of one more addresses and some additional identity info.
      allOf:
        - $ref: '#/components/schemas/ContactIdentity'
        - title: ContactBase
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ContactId'
            addresses:
              title: ContactAddresses
              description: The Contact’s communication addresses, such as phone number, email address, and push device token.
              type: array
              items:
                $ref: '#/components/schemas/ContactAddress'
            external_identifier:
              $ref: '#/components/schemas/ExternalIdentifier'
            custom_fields:
              $ref: '#/components/schemas/ContactCustomFields'
            tags:
              $ref: '#/components/schemas/Tags'
            related:
              title: ContactRelatedResources
              description: A list of resources that are associated with the Contact.
              type: array
              items:
                $ref: '#/components/schemas/RelatedResource'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            deleted_at:
              type:
                - string
                - 'null'
              format: date-time
          required:
            - id
            - created_at
            - updated_at
            - deleted_at
    PaginationMetadata:
      title: PaginationMetadata
      description: |-
        Metadata for paginated of results. 
        This object contains two URLs to navigate through paginated results. 
        - Use `next` to retrieve the 'next' page in the result list.
        - Use `self` to retrieve the same page of the result list again. 
        - URLs use page tokens and supply the values in the `page_token` query param.
      type: object
      properties:
        next:
          description: URL to the next page of results using a token.
          type:
            - string
            - 'null'
        self:
          description: URL to the current page of results using a token.
          type: string
      required:
        - next
        - self
    TwilioError:
      title: TwilioError
      type: object
      description: A generic error object communicating client and server side API errors.
      properties:
        code:
          type: integer
          description: The Twilio error code.
        message:
          type: string
          description: A human readable message describing the error.
        info_url:
          type: string
          format: uri
          description: A URL to a [Twilio error directory](https://www.twilio.com/docs/api/errors) page with more information about the error code.
        context:
          description: A JSON path that identifies the errant field.
          type:
            - string
            - 'null'
      required:
        - code
        - message
        - info_url
        - context
      example:
        code: 21614
        message: The address specified in the request is not a valid phone number.
        info_url: https://www.twilio.com/docs/api/errors/21614
        context: $.to[0].address
    TwilioErrors:
      title: TwilioErrors
      type: object
      properties:
        errors:
          description: A list of one or more Twilio API errors.
          type: array
          items:
            $ref: '#/components/schemas/TwilioError'
      required:
        - errors
      example:
        errors:
          - code: 21614
            message: The address specified in the request is not a valid phone number.
            info_url: https://www.twilio.com/docs/api/errors/21614
            status: 400
            context: $.to[0].address
          - code: 21617
            message: The concatenated message text exceeds the 1600 character limit
            info_url: https://www.twilio.com/docs/api/errors/21617
            status: 400
            context: $.content.text
    TagsNullable:
      title: TagsNullable
      type:
        - object
        - 'null'
      nullable: true
      description: |-
        Custom metadata in the form of key-value pairs.
        Maximum size of a tag key is 128 characters.
        Maximum size of a tag value is 256 characters.
        There can be a maximum of 10 key-value pairs.
      additionalProperties:
        type: string
      maxProperties: 10
    ContactCustomFieldsNullable:
      title: ContactCustomFieldsNullable
      type:
        - object
        - 'null'
      nullable: true
      description: |-
        Custom fields in the form of key-value pairs.
        Maximum size of a custom field key is 128 characters.
        Maximum size of a custom field is 256 characters.
        There can be a maximum of 10 custom fields.
      additionalProperties:
        $ref: '#/components/schemas/ContactFieldValue'
      maxProperties: 10
      example:
        favorite_color:
          value: purple
        favorite_number:
          value: 42
        is_favorite_color_purple:
          value: true
        colors:
          value:
            - purple
            - blue
            - green
    CommunicationChannel:
      title: CommunicationChannel
      description: |-
        The medium which a unit of communication is transmitted through.
        These are differentiated by a mix of transmission protocol, network controller/owner, endpoint and address model,
        as well as the model for content of the atomic unit of communication itself.
      type: string
      enum:
        - email
        - phone
        - whatsapp
        - push
    OperationStatus:
      title: OperationStatus
      type: string
      description: The status of an Operation.
      enum:
        - processing
        - completed
        - canceled
    ContactOperation:
      title: ContactOperation
      type: object
      description: |-
        A Operation represents the aggregate work to be completed for a POST request to the /Contacts, /Audiences endpoint.
        The work maybe be performed asynchronously and the Contact Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/OperationStatus'
        stats:
          title: ContactOperationStats
          type: object
          properties:
            total:
              type: integer
              minimum: 0
            queued:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - created_at
        - updated_at
    ContactStandardField:
      title: ContactStandardField
      type: object
      description: A standard field that exists on a contact, every account has these.
      properties:
        name:
          type: string
          description: Name of the field, for example 'first_name'.
          maxLength: 128
        type:
          type: string
          description: Type of the field.
          enum:
            - string
            - boolean
            - enum
            - number
        values:
          type: array
          description: List of possible values for the field when the type is enum.
          maxItems: 10
          items:
            type: string
          default: []
        is_filterable:
          type: boolean
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
          default: false
      required:
        - name
        - type
        - is_filterable
    ContactCustomFieldId:
      description: A reference to a Contact Custom Field.
      title: ContactCustomFieldId
      type: string
      pattern: ^comms_customfield_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_customfield_01h9krwprkeee8fzqspvwy6nq8
    ContactCustomField:
      title: ContactCustomField
      type: object
      description: A custom field that can be added to a contact.
      properties:
        id:
          $ref: '#/components/schemas/ContactCustomFieldId'
          description: Unique identifier for the custom field, this is generated upon creation of the custom field.
        name:
          type: string
          description: Name of the custom field, for example 'favorite_color'.
          maxLength: 128
        type:
          type: string
          description: Type of the custom field.
          enum:
            - string
            - boolean
            - enum
            - number
            - array
        values:
          type: array
          description: List of possible values for the custom field when the type is enum.
          maxItems: 10
          items:
            type: string
          default: []
        is_filterable:
          type: boolean
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
          default: false
        created_at:
          type: string
          description: Date and time when the custom field was created.
          format: date-time
        updated_at:
          type: string
          description: Date and time when the custom field was last updated.
          format: date-time
        deleted_at:
          type:
            - string
            - 'null'
          description: Date and time when the custom field was deleted.
          format: date-time
      required:
        - id
        - name
        - type
        - is_filterable
        - values
        - created_at
        - updated_at
        - deleted_at
    ContactFieldString:
      title: ContactFieldString
      description: |-
        A custom field of type 'string' for Contacts.
        This field can be used to store text values.
      type: object
      properties:
        type:
          type: string
          const: string
        name:
          type: string
          maxLength: 128
        is_filterable:
          type: boolean
          default: false
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
      required:
        - type
        - name
    ContactFieldNumber:
      title: ContactFieldNumber
      description: |-
        A custom field of type 'number' for Contacts.
        This field can be used to store numeric values.
      type: object
      properties:
        type:
          type: string
          const: number
        name:
          type: string
          maxLength: 128
        is_filterable:
          type: boolean
          default: false
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
      required:
        - type
        - name
    ContactFieldBoolean:
      title: ContactFieldBoolean
      description: |-
        A custom field of type boolean for Contacts.
        This field can be used to store true/false values.
      type: object
      properties:
        type:
          type: string
          const: boolean
        name:
          type: string
          maxLength: 128
        is_filterable:
          type: boolean
          default: false
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
      required:
        - type
        - name
    ContactFieldStringArray:
      title: ContactFieldStringArray
      description: |-
        A custom field of type 'array' for Contacts.
        This field can be used to store a list of text values.
      type: object
      properties:
        type:
          type: string
          const: array
        name:
          type: string
          maxLength: 128
        is_filterable:
          type: boolean
          default: false
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
      required:
        - type
        - name
    ContactFieldEnum:
      title: ContactFieldEnum
      description: |-
        Represents a custom field of type 'enum' for contacts.
        This field type allows you to define a set of predefined, allowed values.
        The `values` property contains the list of possible values.
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        type:
          type: string
          const: enum
        values:
          type: array
          maxItems: 10
          items:
            type: string
        is_filterable:
          type: boolean
          default: false
          description: Whether the custom field can be used as a filter. Limited to 3 per account.
      required:
        - type
        - name
        - values
    AudienceId:
      title: AudienceId
      description: A reference to an Audience.
      type: string
      pattern: ^comms_audience_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_audience_01h9krwprkeee8fzqspvwy6nq8
    AudienceFilter:
      title: AudienceFilter
      description: |-
        A set of predicates for Contacts that defines the Audience. For examples:
          - `Contact.location.country_code == 'US' AND Contact.custom_fields.industry IN('Technology', 'Finance')`
          - `Contact.location.country_code == 'EE' AND (Contact.custom_fields.skills IN ='java' OR Contact.custom_fields.employer = 'Twilio')`
          - `Contact.addresses.channel == 'WhatsApp' AND Contact.tags IN('marketing', 'shipping_notifications')`

        *Once a filter is set on an audience it can be updated, but it cannot be removed.*
      type: string
      example: Contact.location.country_code == 'US' AND Contact.custom_fields.industry IN('Technology', 'Finance')
    Audience:
      title: Audience
      type: object
      description: 'An Audience represents a group of people or entities to communicate with. '
      properties:
        id:
          $ref: '#/components/schemas/AudienceId'
        name:
          description: The name of the Audience.
          type: string
        filter:
          $ref: '#/components/schemas/AudienceFilter'
        total_contacts:
          description: The approximate number of Contacts in the Audience.
          type: integer
        tags:
          $ref: '#/components/schemas/Tags'
        related:
          title: AudienceRelatedResources
          description: A list of resources that are associated with the Audience.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - name
        - total_contacts
        - tags
        - created_at
        - updated_at
        - deleted_at
    EmailAddressSender:
      title: EmailAddressSender
      description: An email address and associated name
      type: object
      properties:
        address:
          type: string
          description: The email address of the person or entity.
          format: email
        name:
          type: string
          description: The name of the person or entity associated with the email address.
      required:
        - address
        - name
    ContentPersonalization:
      title: ContentPersonalization
      type: object
      description: To personalize content for each recipient, supply variables here with values to substitute into any [Liquid](https://shopify.github.io/liquid/) templated content string or pre-stored Content template.
      additionalProperties:
        type: string
    ProfileId:
      title: ProfileId
      description: A reference to a Profile
      type: string
      pattern: ^mem_profile_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: mem_profile_01h9krwprkeee8fzqspvwy6nq8
    EmailHtmlContent:
      title: EmailHtmlContent
      type: object
      properties:
        html:
          type: string
          description: |-
            The HTML email body (`text/html` MIME).

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        text:
          type: string
          description: |-
            The plain-text email body (`text/plain` MIME).

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        subject:
          type: string
          description: |-
            The subject of the email.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        headers:
          title: EmailHeadersContent
          type: object
          description: |-
            Custom email headers as key-value pairs.
            You may not override the following headers: `x-sg-id`, `x-sg-eid`,
            `received`, `dkim-signature`, `Content-Type`, `Content-Transfer-Encoding`,
            `To`, `From`, `Subject`, `Reply-To`, `CC`, `BCC`.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
          additionalProperties:
            type: string
        footer:
          title: EmailFooter
          type: object
          description: Inserts a custom footer at the bottom of the text and HTML bodies of your messages.
          properties:
            enabled:
              type: boolean
              description: Indicates if this setting is enabled.
              default: false
            text:
              type: string
              description: |-
                The plain text content of your footer.

                This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                Specify `variables` with each recipient for personalization.
            html:
              type: string
              description: |-
                The HTML content of your footer.

                This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                Specify `variables` with each recipient for personalization.
      required:
        - html
        - subject
    EmailAddressRecipient:
      title: EmailAddressRecipient
      description: An email address and associated name that define a recipient.
      type: object
      properties:
        address:
          type: string
          description: The email address of the person or entity.
          format: email
        name:
          type: string
          description: The name of the person or entity.
      required:
        - address
    ProfileRecipient:
      title: ProfileRecipient
      description: A reference to a Profile.
      type: object
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
      required:
        - profile_id
    ContactRecipient:
      description: A reference to a Contact.
      title: ContactRecipient
      type: object
      properties:
        contact_id:
          $ref: '#/components/schemas/ContactId'
      required:
        - contact_id
    Schedule:
      title: Schedule
      description: A schedule defines *when* a communication will be sent to a recipient.
      type: object
      properties:
        send_at:
          description: |-
            List of expressions for when the communication may be sent.

            The supported expression formats are:
              - RFC 3339 date-time string. e.g `"2025-11-11T11:11:00Z"`

            Currently, you may specify only a single expression.
            If you specify multiple expressions, only the first will be used.
            Support for additional scheduling expression formats may be added in the future.
          type: array
          items:
            type: string
      minProperties: 1
      additionalProperties: false
    SessionId:
      title: SessionId
      description: A reference to a Session.
      type: string
      pattern: ^comms_session_[a-hjkmnpqrstv-z0-9]{26,34}
      example: comms_session_01h9krwprkeee8fzqspvwy6nq8
    MessageAgentChannel:
      title: MessageAgentChannel
      description: The channels available for Message entity.
      type: string
      enum:
        - sms
        - rcs
        - whatsapp
      example: sms
    MessageStatus:
      title: MessageStatus
      description: |-
        The status of a `Message`. The status can be one of the following:
        - `scheduled` The `Message` is scheduled to be sent by
          Twilio in the future.

        - `queued` The `Message` is queued in Twilio for sending.
        - `sent` The `Message` has been sent by Twilio.
        - `delivered` The `Message` has been successfully
            delivered to the recipient.

        - `read` The `Message` has been read by the recipient.
        - `undelivered` The `Message` was successfully sent by Twilio
          but have not been delivered to the recipient.

        - `failed` The `Message` processing failed inside Twilio.
          Use `GET /Messages/Operations/{operation_id}/Errors` for more details.

        - `canceled` The `Message` was canceled via API request.
        - `group` The `Message` is part of a group communication.
          To get the status for each Recipient of the group communication, use the `Receipts` endpoint
          e.g. GET `/Messages/comms_message_01h2xcejqtf2nbrexx3vqjhp41/Receipts`

        - `inbound` The `Message` was received by Twilio from an external source.
      type: string
      enum:
        - queued
        - sent
        - scheduled
        - delivered
        - read
        - failed
        - undelivered
        - canceled
        - group
        - inbound
    MessageId:
      description: A reference to a Message.
      title: MessageId
      type: string
      pattern: ^comms_message_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_message_01h9krwprkeee8fzqspvwy6nq8
    AgentId:
      description: A reference to an Agent.
      title: AgentId
      type: string
      pattern: ^comms_agent_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_agent_01h9krwprkeee8fzqspvwy6nq8
    MessageAgent:
      title: MessageAgent
      description: A Message Agent is a person or entity whose communication identity is hosted by Twilio.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for an agent (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageAgentChannel'
        agent_id:
          $ref: '#/components/schemas/AgentId'
      required:
        - address
        - channel
        - agent_id
      additionalProperties: false
    AgentPoolId:
      description: A reference to an AgentPool.
      title: AgentPoolId
      type: string
      pattern: ^comms_agentpool_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_agentpool_01h9krwprkeee8fzqspvwy6nq8
    MessageAgentAndPool:
      title: MessageAgentAndPool
      description: A Message Agent is a person or entity whose communication identity is hosted by Twilio. The `agent_pool_id` field indicates the pool for which the `Agent` was resolved from.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for an Agent (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageAgentChannel'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        agent_pool_id:
          $ref: '#/components/schemas/AgentPoolId'
      required:
        - address
        - channel
        - agent_id
        - agent_pool_id
    MessageContactChannel:
      title: MessageContactChannel
      description: |-
        The channels available for specifying a Message Contact.

        - `phone`: Includes SMS, MMS, and RCS, pair it with a phone number in the `address` field.

        - `whatsapp`: WhatsApp channel, pair it with a WhatsApp number in the `address` field.
      type: string
      enum:
        - phone
        - whatsapp
      example: phone
    MessageContact:
      title: MessageContact
      description: A Message Contact is a person or entity that is not hosted by Twilio.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for a contact (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageContactChannel'
        contact_id:
          x-twilio-version: preview
          $ref: '#/components/schemas/ContactId'
      required:
        - address
        - channel
      additionalProperties: false
    MessageBase:
      title: MessageBase
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MessageId'
        from:
          title: MessageSender
          description: The sender of the Message.
          oneOf:
            - $ref: '#/components/schemas/MessageAgent'
            - $ref: '#/components/schemas/MessageAgentAndPool'
            - $ref: '#/components/schemas/MessageContact'
        to:
          title: MessageRecipients
          description: |-
            The list of recipient(s) that the Message was directed to. 

            - This list is always of size 1, except for Group Messaging usage, 
            where the number of recipients plus the sender will match the group size.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageAgent'
              - $ref: '#/components/schemas/MessageContact'
        status:
          $ref: '#/components/schemas/MessageStatus'
        related:
          title: MessageRelatedResources
          description: A list of resources that are associated with the Message.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        tags:
          $ref: '#/components/schemas/Tags'
        created_at:
          description: The date and time when the entity was created.
          type: string
          format: date-time
        updated_at:
          description: The date and time when the entity was last updated.
          type: string
          format: date-time
        scheduled_for:
          description: |-
            The scheduled send time of the `Message`.
            This field is only present if the `Message` was created with a `schedule`.
          type:
            - string
            - 'null'
      required:
        - id
        - from
        - to
        - status
        - related
        - tags
        - scheduled_for
        - created_at
        - updated_at
        - deleted_at
    MessageMetadata:
      title: MessageMetadata
      type: object
      description: The MessageMetadata provides information about the Message but does not include the Content or Attempts.
      allOf:
        - $ref: '#/components/schemas/MessageBase'
    MessageAddressRecipient:
      title: MessageAddressRecipient
      description: A messaging address and channel that defines the recipient of a Message.
      type: object
      properties:
        address:
          type: string
          description: The Agent’s communication address within a channel, such as a phone number, email address, or device token.
        channel:
          $ref: '#/components/schemas/MessageContactChannel'
      required:
        - address
        - channel
    RecipientVariables:
      title: RecipientVariables
      type: object
      properties:
        variables:
          $ref: '#/components/schemas/ContentPersonalization'
    MediaUrl:
      title: MediaUrl
      type: object
      description: A publicly accessible URL of a media file (image, etc.) to include in the message. The media file will be copied to Twilio's servers and then sent to the recipient.
      properties:
        url:
          type: string
          minLength: 1
          description: |-
            The publicly accessible URL of the media file to copy.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization 
            and `default_variables` for default values.
      required:
        - url
    ContentMediaInput:
      title: ContentMediaInput
      type: array
      description: |-
        A list of Media (images, etc.) to include in the message.

        Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

        Specify `variables` with each recipient for personalization 
        and `default_variables` for default values.
      items:
        $ref: '#/components/schemas/MediaUrl'
    DefaultVariables:
      title: DefaultVariables
      type: object
      description: |-
        These are default values that can be declared for use with templated content fields including `text` and `title`.
        When a template variable value is defined using a ${Twilio.Contact} reference, a default value must be defined here as well.
        When sending templated content 'to' an `Audience`, it is mandatory to define a default value for each variable used in the template.
      additionalProperties:
        type: string
    MessageContentTextWithMedia:
      title: MessageContentTextWithMedia
      description: The text and media content of a `Message`.
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: |-
            A simple content string (formerly called 'body').

            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization  and `default_variables` for default values.
        media:
          description: |-
            A list of Media (images, etc.) to include in the message.

            If this field is specified, Twilio will attempt to send the `Message` as an MMS.

            Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

            Specify `variables` with each recipient for personalization
            and `default_variables` for default values.
          $ref: '#/components/schemas/ContentMediaInput'
        default_variables:
          $ref: '#/components/schemas/DefaultVariables'
      additionalProperties: false
      minProperties: 1
    ContentId:
      description: A reference to a Content template.
      title: ContentId
      type: string
      pattern: ^HX[a-zA-Z0-9]{26,34}$
      example: HX78e8e67fc0246521490fb9907fd0c165
    MessageContentTemplate:
      title: MessageContentTemplate
      description: A reference to a stored Content template  that can be used to generate content for a Message.
      type: object
      properties:
        content_id:
          $ref: '#/components/schemas/ContentId'
      required:
        - content_id
    MessageContentSms:
      title: MessageContentSms
      description: The text and media content of the SMS/MMS `Message`. If media is provided, Twilio will attempt to send the message as an MMS.
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: |-
            A simple content string (formerly called 'body').

            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization  and `default_variables` for default values.
        media:
          description: |-
            A list of Media (images, etc.) to include in the message.

            If this field is specified, Twilio will attempt to send the `Message` as an MMS.

            Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

            Specify `variables` with each recipient for personalization
            and `default_variables` for default values.
          $ref: '#/components/schemas/ContentMediaInput'
      additionalProperties: false
      minProperties: 1
    MessageContentModuleSms:
      title: MessageContentModuleSms
      description: |-
        The `sms` (includes mms) content module for Messages.
        For RCS use `MessageContentModuleRcs`.
      type: object
      properties:
        sms:
          description: The `sms` (includes mms) content module for Messages.
          $ref: '#/components/schemas/MessageContentSms'
      required:
        - sms
    MessageContentRcsSuggestionPostbackData:
      title: MessageContentRcsSuggestionPostbackData
      description: The postback data to send when the suggestion item is selected.
      type: string
      minLength: 1
    MessageContentRcsDialAction:
      title: MessageContentRcsDialAction
      description: An RCS suggested action of type Dial.
      type: object
      properties:
        phone_number:
          type: string
          description: The phone number to call when the action is triggered.
      required:
        - phone_number
    MessageContentRcsOpenUrlAction:
      title: MessageContentRcsOpenUrlAction
      description: An RCS action of type Open Url.
      type: object
      properties:
        url:
          title: MessageContentRcsOpenUrlActionUrl
          type: string
          description: The url to open when the suggested action is selected.
      required:
        - url
    MessageContentRcsSuggestedAction:
      title: MessageContentRcsSuggestedAction
      description: An RCS action suggestion.
      type: object
      properties:
        action:
          title: MessageContentRcsAction
          description: The RCS action to suggest.
          type: object
          oneOf:
            - title: MessageContentRcsSuggestedActionDial
              type: object
              description: A action item that when selected by the recipient, initiates a voice call using the native calling app on the device.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionDialText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postback_data:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                dial_action:
                  $ref: '#/components/schemas/MessageContentRcsDialAction'
              required:
                - text
                - postback_data
                - dial_action
            - title: MessageContentRcsSuggestedActionOpenUrl
              type: object
              description: A action item, that when selected by the recipient, opens the provided `url` on the end-users device.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionOpenUrlText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postback_data:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                open_url_action:
                  $ref: '#/components/schemas/MessageContentRcsOpenUrlAction'
              required:
                - text
                - postback_data
                - open_url_action
      required:
        - action
    MessageContentRcsSuggestedReply:
      title: MessageContentRcsSuggestedReply
      type: object
      description: An RCS reply suggestion.
      properties:
        reply:
          title: MessageContentRcsReply
          description: The RCS reply to suggest.
          type: object
          properties:
            text:
              title: MessageContentRcsReplyText
              description: The text to display for the suggested reply.
              type: string
              minLength: 1
            postback_data:
              $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
          required:
            - text
            - postback_data
      required:
        - reply
    MessageContentRcsSuggestions:
      title: MessageContentRcsSuggestions
      description: A list of RCS suggestions to display.
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/MessageContentRcsSuggestedAction'
          - $ref: '#/components/schemas/MessageContentRcsSuggestedReply'
    MessageContentRcsContentInfo:
      title: MessageContentRcsContentInfo
      description: An RCS Content Info.
      type: object
      properties:
        file_url:
          type: string
          description: The URL of the media file.
        thumbnail_url:
          type: string
          description: The URL of the thumbnail image for the media.
      required:
        - file_url
    MessageContentRcsMedia:
