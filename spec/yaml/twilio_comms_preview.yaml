                      variables:
                        first_name: ${Twilio.Contact.first_name}
                        last_name: ${Twilio.Contact.last_name}
                        gender: ${Twilio.Contact.gender}
                    - audience_id: comms_audience_01h9krwprkeee8fzqspvwy6nq8
