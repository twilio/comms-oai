      properties:
        rcs:
          title: MessageContentRcs
          description: |-
            The RCS content, follows the RCS Business Messaging `AgentContentMessage` format.
            For more information, see [RCS Business Messaging](https://developers.google.com/business-communications/rcs-business-messaging)
          type: object
          oneOf:
            - title: MessageContentModuleRcsText
              description: The RCS union Text content.
