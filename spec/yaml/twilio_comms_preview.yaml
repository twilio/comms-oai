          - type: object
            title: PushNotificationContentPassthroughItem
            properties:
              provider:
                $ref: '#/components/schemas/PushNotificationProvider'
          - $ref: '#/components/schemas/ContentChannelPassthrough'
    PushNotificationContentText:
      x-twilio-status: deprecated
      title: PushNotificationContentText
      type: object
      description: Push Notification content with text.
      properties:
        title:
          type: string
          description: |-
            The title of the push notification. Defaults to the app name.

              
            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization and `default_variables` for default values.
        text:
          type: string
          description: |-
            A simple string or templated content.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization 
            and `default_variables` for default values.
        provider_passthrough:
          $ref: '#/components/schemas/PushNotificationContentPassthroughArray'
        default_variables:
          $ref: '#/components/schemas/DefaultVariables'
      required:
        - text
    PushNotificationContentTextResolved:
      x-twilio-status: deprecated
      title: PushNotificationContentTextResolved
      type: object
      description: A resolved push notification content object with body.
      properties:
        title:
          type: string
          description: The title of the push notification. Defaults to the app name.
        text:
          type: string
          description: A simple content string.
      required:
        - text
    PushNotificationContentResolved:
      title: PushNotificationContentResolved
      description: The resolved content of the Push Notification.
      type: object
      properties:
        content:
          oneOf:
            - $ref: '#/components/schemas/PushNotificationContentTextResolved'
      required:
        - content
    PushNotification:
      title: PushNotification
      type: object
      description: A push notification is a short, ephemeral message sent to an Android device, iOS device or web browser session.
      allOf:
        - $ref: '#/components/schemas/PushNotificationBase'
        - $ref: '#/components/schemas/PushNotificationContentResolved'
    PushNotificationOperationStats:
      title: PushNotificationOperationStats
      type: object
      example:
        total: 1
        recipients: 1
        queued: 0
        sent: 0
        scheduled: 0
        unaddressable: 0
        failed: 0
        canceled: 0
      description: |-
        Represents the stats of a sending operation of one or many `Push Notifications`.
        - `total` is the total number of `Push Notifications` in the `Operation`.

          * To get the status for each `Push Notification`, fetch the resource with:
            `GET /PushNotifications/{push_notification_id}`.

        - `recipients` is the total number of recipients targeted in an Operation.
        - `unaddressable` is the number of recipients to which no sending attempts were made because
          a valid token could not be found in the recipient's `Device Registration` set for the
          `Credentials` or `App` provided.

        - `scheduled` is the number of `Push Notifications` that are scheduled to be sent by
          Twilio in the future.

        - `queued` is the number of `Push Notifications` that are queued in Twilio for sending.
        - `sent` is the number of `Push Notifications` that have been sent by Twilio.
        - `failed` is the number of `Push Notifications` that failed during processing by Twilio.
          Get `Errors` with `GET /PushNotifications/Operations/{operation_id}/Errors` fore more detail.

        - `canceled` is the number of `Push Notifications` that were canceled via API request.
      properties:
        total:
          type: integer
          minimum: 0
        recipients:
          type: integer
          minimum: 0
        unaddressable:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
      required:
        - total
        - recipients
        - unaddressable
        - scheduled
        - queued
        - sent
        - failed
        - canceled
    PushNotificationOperation:
      title: PushNotificationOperation
      type: object
      description: |-
        A Push Notification Operation represents the aggregate work to be completed for a POST request to the /PushNotifications endpoint.
        The work maybe be performed asynchronously and the PushNotification Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/CommunicationOperationStatus'
        stats:
          $ref: '#/components/schemas/PushNotificationOperationStats'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - created_at
        - updated_at
    PushCredentialType:
      title: PushCredentialType
      description: The credential types available for PushNotifications.
      type: string
      enum:
        - apn
        - apn_sandbox
        - fcm
    AccountPushCredentialFlag:
      title: AccountPushCredentialFlag
      description: |-
        Use this Credential as the default for the Push Notification `App` for the
          given `credential_type` to send Push Notifications. 
        If a Credential of the given type doesn't already exist, 
          this Credential automatically becomes the default.
      type: boolean
      default: false
    PushNotificationCredential:
      title: PushNotificationCredential
      type: object
      description: Credential properties are specific to the channel type and provided by the vendor that supports it.
      properties:
        id:
          $ref: '#/components/schemas/CredentialId'
        credential_type:
          $ref: '#/components/schemas/PushCredentialType'
        is_default:
          $ref: '#/components/schemas/AccountPushCredentialFlag'
        app_name:
          type: string
          description: |-
            The name of the app that this Credential is associated with.
            This should be the same value as the `app_name` set when registering devices for the app
            with `/PushNotifications/DeviceRegistrations`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - credential_type
        - is_default
        - app_name
        - created_at
        - updated_at
    ApnCertificatePushCredential:
      title: ApnCertificatePushCredential
      description: Certificate-based credentials are used to authenticate with the APN service before sending a Notification.  It can be acquired from the Apple Developer Portal. Note that certificates have an expiration date and need to be renewed before they expire. Alternatively, you can use APN Signing Key credentials.
      type: object
      properties:
        certificate:
          type: string
          format: byte
          description: The base64 representation of the certificate. Strip everything outside of the headers,  e.g. `-----BEGIN CERTIFICATE-----MIIFnTCCBIWgAwIBAgIIAjy9H849+E8wDQYJKoZIhvcNAQEFBQAwgZYxCzAJBgNV.....A==-----END CERTIFICATE-----` and encode with base64 encoding.
        private_key:
          type: string
          format: byte
          description: The base64 representation of the private key. Strip everything outside of the headers,  e.g. `-----BEGIN RSA PRIVATE KEY-----MIIEpQIBAAKCAQEAuyf/lNrH9ck8DmNyo3fGgvCI1l9s+cmBY3WIz+cUDqmxiieR\n.-----END RSA PRIVATE KEY-----` and encode with base64 encoding.
      required:
        - private_key
        - certificate
    FcmPushCredential:
      title: FcmPushCredential
      description: FCM credentials are used to authenticate with the Firebase Cloud Messaging service before sending a Notification. COMMS API uses this private key to authenticate with the FCM service before sending a Notification.
      type: object
      properties:
        private_key:
          type: string
          format: byte
          description: The `private_key` field is a JSON object that contains the Google Cloud private key, generated with minimal privileges,  specifically for Cloud Messaging on the Google Cloud Platform. It is recommended to follow the principle of least privilege  when generating this key to ensure security and limit potential misuse. The Google Cloud private key is in a JSON format and must be encoded with base64 before sending.
      required:
        - private_key
      additionalProperties: false
    PushCredentialContent:
      title: PushCredentialContent
      description: Credential properties are specific to the channel type and provided by the vendor that supports it.
      oneOf:
        - $ref: '#/components/schemas/ApnCertificatePushCredential'
        - $ref: '#/components/schemas/FcmPushCredential'
    PushNotificationAppDefaultCredential:
      title: PushNotificationAppDefaultCredential
      type: object
      description: The default Credential for a `credential_type` (provider) for a Push Notification `App`
      properties:
        id:
          $ref: '#/components/schemas/CredentialId'
        credential_type:
          $ref: '#/components/schemas/PushCredentialType'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - credential_type
        - created_at
        - updated_at
    PushNotificationApp:
      title: PushNotificationApp
      type: object
      properties:
        name:
          description: The name of the `App`. This is the unique identifier of the `App`.
          allOf:
            - $ref: '#/components/schemas/PushNotificationAppName'
        is_default:
          type: boolean
          description: |-
            Whether this `App` is the default (Push Notification) App for the Account.
            The first `App` auto-created is automatically set as the default.
            To update the default `App`, use `PATCH /PushNotifications/Apps/{app_name}`.
        default_credentials:
          type: array
          description: The default Credentials for this `App`.
          items:
            $ref: '#/components/schemas/PushNotificationAppDefaultCredential'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - is_default
        - default_credentials
        - created_at
        - updated_at
    AgentCommunicationChannel:
      description: |-
        The medium which a unit of communication is transmitted through.
        These are differentiated by a mix of transmission protocol, network controller/owner, endpoint and address model,
        as well as the model for content of the atomic unit of communication itself.
      title: AgentCommunicationChannel
      type: string
      enum:
        - sms
        - rcs
        - email
        - whatsapp
        - push
    AgentStatus:
      title: AgentStatus
      description: |-
        The status of an Agent.
        If an Agent is `activated`, it is available to send and receive communications.
        If an Agent is `deactivated`, it is not available to send or receive communications.
      type: string
      enum:
        - activated
        - deactivated
    Agent:
      title: Agent
      description: |-
        an Agent is a sending and receiving communication identity associated with a Twilio application.
        For 'outbound' communications, it is used as the sender of the communication in the 'from' field.
        For 'inbound' communications (sent by a Contact/end-user), it is used as the recipient and populated in the 'to' field.
        An Agent represents existing inventory created and setup in other Twilio APIs, such as Phone Numbers.
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        display_name:
          type:
            - string
            - 'null'
          description: |-
            The name associated with the address inventory, such as phone number or email address.  

            This name might be visible to recipients in certain communications, such as Email, and helps identify the sender. 

            *Note:* To update this value, use the appropriate Twilio API for the inventory type. For example, for Agents with the channel `email`, update `display_name` using the EmailSenders API.
        address:
          type: string
          description: The Agent’s communication address within a channel, such as a phone number, email address, or device token.
        channel:
          $ref: '#/components/schemas/AgentCommunicationChannel'
        status:
          $ref: '#/components/schemas/AgentStatus'
        tags:
          $ref: '#/components/schemas/Tags'
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - display_name
        - address
        - channel
        - status
        - tags
        - updated_at
        - created_at
    CommunicationRecipient:
      title: CommunicationRecipient
      type: object
      properties:
        address:
          description: The Agent’s communication address within a channel, such as a phone number, email address, or device token.
          type: string
        channel:
          $ref: '#/components/schemas/CommunicationChannel'
      required:
        - address
        - channel
    AgentCommunicationChannelControl:
      title: AgentChannelControl
      description: Define controls to filter and prioritize Agents based on their `channel`.
      type: object
      properties:
        filter_in:
          title: AgentChannelControlFilterIn
          description: |-
            A list of eligible channels to constrain `Agent` resolution to;
            leave undefined to send across all available channels.

            Warning: If there is no viable path from any `Agent` to a recipient resulting from
            this filter, no communication will be sent to the recipient(s)!
          type: array
          items:
            $ref: '#/components/schemas/AgentCommunicationChannel'
          uniqueItems: true
        priority:
          title: AgentChannelControlPriority
          description: |-
            A list of channels and their priority for use. 
            Lowest numeric value is highest priority.
          type: array
          items:
            title: AgentChannelControlPriorityItem
            description: A channel and its priority.
            type: object
            properties:
              channel:
                $ref: '#/components/schemas/AgentCommunicationChannel'
              priority:
                type: integer
                description: |-
                  The priority of the channel. Lower values indicate higher priority.
                  For example, a value of `0` indicates the highest priority channel.
            required:
              - channel
              - priority
    AgentPool:
      title: AgentPool
      description: |-
        An AgentPool is a set of sending (and receiving) identities associated with a Twilio application.
        It can contain one or more Agents for use in multi-channel use-cases or to achieve pooling functionalities.
        For 'outbound' communications, it is used as the sender of the communication in the 'from' field.
        For 'inbound' communications sent by a Contact, it is used as the recipient, and populated in the 'to' field.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AgentPoolId'
        name:
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - tags
        - created_at
        - updated_at
    AgentPoolOperation:
      title: AgentPoolOperation
      type: object
      description: |-
        An AgentPool Operation represents the aggregate work to be completed when creating and modifying AgentPools by adding or removing Agents.
        The work maybe be performed asynchronously and the Agent Pool Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/OperationStatus'
        stats:
          title: AgentPoolOperationStats
          type: object
          properties:
            total:
              type: integer
              minimum: 0
            queued:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
          required:
            - total
            - queued
            - created
            - failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - created_at
        - updated_at
  responses:
    Http400Response:
      description: This error indicates that the request content was malformed or ambiguous.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TwilioErrors'
          examples:
            ResourceNotFound:
              summary: Resource not found
              value:
                errors:
                  - code: 20404
                    message: Not Found
                    info_url: https://www.twilio.com/docs/api/errors/20404
                    context: 'null'
    Http429Response:
      description: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TwilioErrors'
          examples:
            TooManyRequests:
              summary: Too Many Requests
              value:
                errors:
                  - code: 20429
                    message: Too many requests. Please retry according to the Retry-After response header.
                    info_url: https://www.twilio.com/docs/api/errors/20429
                    context: 'null'
      headers:
        Retry-After:
          schema:
            type: string
          description: The amount of time in seconds that the customer should wait before issuing a new request towards the API.
    Http500Response:
      description: This error indicates that the Twilio API is experiencing server-side issues. The request should not be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TwilioErrors'
          examples:
            InternalServerError:
              summary: Internal Server Error
              value:
                errors:
                  - code: 20500
                    message: Internal server error.
                    info_url: https://www.twilio.com/docs/api/errors/20500
                    context: 'null'
    Http503Response:
      description: This error indicates that the Twilio API is temporarily unavailable.  You should retry according to the `Retry-After` response header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TwilioErrors'
          examples:
            ServiceUnavailable:
              summary: Service Unavailable
              value:
                errors:
                  - code: 20503
                    message: Service unavailable.
                    info_url: https://www.twilio.com/docs/api/errors/20503
                    context: 'null'
      headers:
        Retry-After:
          schema:
            type: string
          description: The amount of time in seconds that the customer should wait before issuing a new request towards the API.
    Http202ResponseWithOperation:
      description: The request was accepted and an Operation was created to track its progress. The response headers contain the ID and link to the Operation resource.
      headers:
        Operation-Location:
          $ref: '#/components/headers/OperationLocation'
        Operation-Id:
          $ref: '#/components/headers/OperationId'
    Http404Response:
      description: This error indicates that the requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TwilioErrors'
          examples:
            ResourceNotFound:
              summary: 404 Response
              value:
                errors:
                  - code: 20404
                    message: The resource was not found.
                    info_url: https://www.twilio.com/docs/api/errors/20404
                    context: 'null'
    Http202ResponseWithResource:
      description: The request was accepted and a resource identifier is available to check the result. The response headers contain the identifier and link to the resource.
      headers:
        Resource-Location:
          $ref: '#/components/headers/ResourceLocation'
        Resource-Id:
          $ref: '#/components/headers/ResourceId'
  headers:
    OperationLocation:
      schema:
        type: string
        format: uri
      description: The location (uri) of the Operation resource identified by `Operation-Id`.
    OperationId:
      schema:
        $ref: '#/components/schemas/OperationId'
      description: |-
        The Operation ID is an identifier that can be used to correlate all of the resources created in a request.
        Issue a GET request to the resource list location, using the Operation ID as a filter
        to retrieve a list of the created resources and an aggregate status.
    ResourceLocation:
      schema:
        type: string
        format: uri
      description: The location (uri) of the resource identified by `Resource-Id`.
    ResourceId:
      schema:
        type: string
      description: |-
        The Resource ID is an identifier for the resource that was created or updated
          in response to the request.

        Use the `Resource-Location` header to retrieve the resource.
