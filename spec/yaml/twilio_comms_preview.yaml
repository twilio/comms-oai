  /Emails:
    post:
      summary: Send Emails
      operationId: SendEmails
      description: This operation creates and sends out emails to the specified recipients.
      tags:
        - Emails
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithOperation'
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SendEmailsRequest
              type: object
              description: A request to send one or more Emails.
              properties:
                from:
                  title: SendEmailsRequestFrom
                  description: |-
                    The sending identity to associate with the `Email`.

                    - Use `EmailAddressSender` to directly specify the email address that the Email
                       will appear to come 'from'.
                  oneOf:
                    - $ref: '#/components/schemas/EmailAddressSender'
                to:
                  title: SendEmailsRequestTo
                  type: array
                  description: A list of recipients to send the email(s) to.
                  items:
                    title: SendEmailsRecipient
                    oneOf:
                      - title: SendEmailsAddressRecipient
                        description: An email address and associated name that define a recipient.
                        type: object
                        properties:
                          address:
                            type: string
                            description: The email address of the person or entity.
                            format: email
                          name:
                            type: string
                            description: The name of the person or entity.
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - address
                      - title: SendEmailsProfileRecipient
                        type: object
                        description: A Twilio `Profile` identified by `Profile.Id`.
                        properties:
                          profile_id:
                            $ref: '#/components/schemas/ProfileId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - profile_id
                      - title: SendEmailsContactRecipient
                        type: object
                        description: A Twilio `Contact` identified by `Contact.Id`.
                        properties:
                          contact_id:
                            $ref: '#/components/schemas/ContactId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - contact_id
                content:
                  title: SendEmailsRequestContent
                  description: |-
                    The content of the Email.
                    - Use `EmailContent` to supply a `text/html` email body.
                      Optionally provide a `plain/text` body for clients that do not support HTML.
                      If none is specified, Twilio will auto-create one from your HTML email body.

                    ***
                    * Use the [Liquid](https://shopify.github.io/liquid/) templating language for personalization in any text-based field.
                    * When using a templated content, use the `variables` field on each recipient to specify the values to substitute.
                    * For each variable you specify in your template, you should have a matching key in each recipient's `variables` object.
                                
                    * When targeting `Profile` or `Contact` recipients, you may specify `variables` with values that reference stored fields, including custom fields, on the `Profile` or `Contact` -- for example: `${Twilio.Profile.date_last_purchase}` `${Twilio.Contact.first_name}` or `${Twilio.Contact.my_custom_field}`.
                  oneOf:
                    - $ref: '#/components/schemas/EmailHtmlContent'
                reply_to:
                  title: SendEmailsRequestReplyTo
                  description: |-
                    A list of recipients to send replies to when the recipient of this email attempts to reply.
                    This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization.
                  type: array
                  items:
                    title: SendEmailsRequestReplyToRecipient
                    oneOf:
                      - $ref: '#/components/schemas/EmailAddressRecipient'
                      - $ref: '#/components/schemas/ProfileRecipient'
                      - $ref: '#/components/schemas/ContactRecipient'
                cc:
                  title: SendEmailsRequestCC
                  type: array
                  description: |-
                    A list of recipients to carbon-copy ('cc') emails to.
                    Recipients will have visibility of each other's addresses.

                    This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                    Specify `variables` with each recipient for personalization.
                  maxItems: 50
                  items:
                    title: SendEmailsRequestCCRecipient
                    oneOf:
                      - $ref: '#/components/schemas/EmailAddressRecipient'
                      - $ref: '#/components/schemas/ProfileRecipient'
                      - $ref: '#/components/schemas/ContactRecipient'
                bcc:
                  title: SendEmailsRequestBCC
                  type: array
                  description: |-
                    A list of recipients to blindly carbon-copy ('cc') emails to.
                    Recipients will NOT have visibility of each other's addresses.

                    This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                    Specify `variables` with each recipient for personalization.
                  maxItems: 50
                  items:
                    title: SendEmailsRequestBCCRecipient
                    oneOf:
                      - $ref: '#/components/schemas/EmailAddressRecipient'
                      - $ref: '#/components/schemas/ProfileRecipient'
                      - $ref: '#/components/schemas/ContactRecipient'
                tags:
                  $ref: '#/components/schemas/Tags'
                schedule:
                  $ref: '#/components/schemas/Schedule'
                ip_pool_name:
                  type: string
                  description: |-
                    The name of the IP Pool to use for sending Emails.

                    If not specified, all dedicated IPs associated with your
                    account will be considered for sending. 

                    IP pools are only available to accounts with dedicated IPs.

                    This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                    Specify `variables` with each recipient for personalization.
                  minLength: 2
                  maxLength: 64
              required:
                - from
                - to
                - content
            examples:
              SendFromToDirectEntities:
                summary: Send from, to direct entities
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - address: bob@example.com
                      name: Bob Smith
                  content:
                    subject: 'Re: Wedding Cake'
                    text: Hey, the cake is ready.
                    html: <html><body>Hey, <br/><br/>Cake</b></body></html>
                    attachments: []
              SendToProfileWithPersonalization:
                summary: Send to Contact with Contact-referencing personalization
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - profile_id: mem_profile_01h9krwprkeee8fzqspvwy6nq8
                      variables:
                        name: ${Twilio.profile.first_name}
                  content:
                    subject: Wedding Cake
                    text: Hey {{ name }}, your cake is ready.
                    html: '<html><body>Hey, {{ name | default: ''there'' }}, your cake is ready.<br/><br/></body></html>'
                    attachments: []
              SendAScheduledEmail:
                summary: Send a scheduled Email
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - contact_id: comms_contact_01h9krwprkeee8fzqspvwy6nq8
                      variables:
                        name: ${Twilio.Contact.first_name}
                        is_vip: ${Twilio.Contact.is_vip}
                  content:
                    subject: Wedding Cake
                    text: Hey {{ name }}, your cake will be ready for pickup tomorrow morning. {% if is_vip %} Thanks for your continued business, we've included a special treat for you! {% endif %}
                    html: '<html><body>Hey, {{ name | default: ''there'' }}, your cake is ready.<br/><br/> {% if is_vip %} <p>Thanks for your continued business, we''ve included a special treat for you!</p> {% endif %} </body></html>'
                    attachments: []
                  schedule:
                    send_at:
                      - '2023-12-15T14:15:22Z'
              SendWithCustomHeaders:
                summary: Send email with custom headers and footer
                value:
                  from:
                    address: marketing@example.com
                    name: Marketing Team
                  to:
                    - address: customer@example.com
                      name: Valued Customer
                  content:
                    subject: Special Offer for You
                    html: <html><body><h1>Exclusive Deal!</h1><p>Check out our latest offers.</p></body></html>
                    text: Exclusive Deal! Check out our latest offers.
                    headers:
                      X-Campaign-ID: CAMPAIGN-2025-Q1
                      X-Customer-Segment: VIP
                      X-Priority: '1'
                    footer:
                      enabled: true
                      html: <p style="font-size:11px;color:#666;">Marketing Team, Example Inc. | <a href="[unsubscribe]">Unsubscribe</a> | 123 Main St, San Francisco, CA 94105</p>
                      text: 'Marketing Team, Example Inc. | Unsubscribe: [unsubscribe] | 123 Main St, San Francisco, CA 94105'
              SendWithIPPool:
                summary: Send email using dedicated IP pool
                value:
                  from:
                    address: alerts@example.com
                    name: Alert System
                  to:
                    - address: admin@example.com
                      name: System Administrator
                  content:
                    subject: System Alert - High Priority
                    html: <html><body><h1>Alert</h1><p>Immediate attention required.</p></body></html>
                  ip_pool_name: transactional_pool
              SendTemplateWithHeadersAndIPPool:
                summary: Send template-based email with headers and IP pool
                value:
                  from:
                    address: newsletter@example.com
                    name: Newsletter Team
                  to:
                    - address: subscriber@example.com
                      name: John Subscriber
                      variables:
                        first_name: John
                  content:
                    subject: January Newsletter
                    html: '<html><body><h1>Newsletter</h1><p>Greetings {{ first_name | default: ''Subscribers'' }}, it''s January!</p></body></html>'
                    headers:
                      X-Newsletter-Edition: 2025-01
                      X-Subscriber-Tier: Premium
                  ip_pool_name: marketing_pool
                  tags:
                    campaign: monthly_newsletter
                    edition: january_2025
  /Messages:
    post:
      summary: Send Messages
      operationId: SendMessages
      description: This operation creates and sends out messages to the specified recipients.
      tags:
        - Messages
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithOperation'
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SendMessagesRequest
              type: object
              properties:
                to:
                  title: SendMessagesRequestTo
                  description: |-
                    An array of recipient objects to send the message(s) to.

                    - Use `AddressRecipient` to describe the recipient by their
                    address.

                    - Use `ConnectedAddressRecipient` to send a message to a recipient
                      with multiple addresses, Twilio will select the optimal channel and perform
                      retries across channels (if necessary).

                    - Use `ContactRecipient` to reference a stored `Contact`.

                    - Use `ContactRecipientFinder` to reference a stored `Contact` by a field
                      other than the `Contact.Id`.

                    - Use `AudienceRecipient` to send a message to an audience.

                    - Use `GroupRecipient` for group messaging.
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    title: SendMessagesRecipient
                    oneOf:
                      - type: object
                        title: SendMessagesAddressRecipient
                        description: The address and channel to reach your recipient.
                        allOf:
                          - $ref: '#/components/schemas/MessageAddressRecipient'
                          - $ref: '#/components/schemas/RecipientVariables'
                      - type: object
                        title: SendMessagesConnectedAddressRecipient
                        description: A recipient with multiple address for Messaging. Provide a list of addresses for a recipient and Twilio will pick the best one.  Twilio will automatically handle errors and retry across channels if necessary.
                        properties:
                          addresses:
                            type: array
                            items:
                              $ref: '#/components/schemas/MessageAddressRecipient'
                            minItems: 1
                            maxItems: 10
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - addresses
                      - type: object
                        title: SendMessagesContactRecipient
                        description: A Twilio `Contact` identified by `Contact.Id`.
                        properties:
                          contact_id:
                            $ref: '#/components/schemas/ContactId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - contact_id
                      - type: object
                        title: SendMessagesAudienceRecipient
                        description: A Twilio `Audience` identified by `Audience.Id`.
                        properties:
                          audience_id:
                            $ref: '#/components/schemas/AudienceId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - audience_id
                content:
                  title: SendMessagesRequestContent
                  type: object
                  description: |-
                    The content of the Message.

                    - Use `MessageContentTextWithMedia` to send a Message with just text and/or media.

                    - Use `MessageContentTemplate` to reference a stored `Content` template.

                    - Use `MessageContentChannelModules` to send rich content and 
                      different content per channel.

                    ***

                    * Use the [Liquid](https://shopify.github.io/liquid/)
                    templating language for personalization in any text-based field.

                    * When using a templated content,
                    use the `variables` field on each recipient to specify
                    the values to substitute.

                    * For each variable you specify in your template, you should have
                    a matching key in each recipient's `variables` object.

                    * For each variable in your template, you may also specify a default in
                    `default_variables`.

                    * When targeting an `Audience`, it is *mandatory* to define defaults
                    in `default_variables` for all variables in the template.

                    * When targeting `Audience` or `Contact` recipients, you may specify `variables`
                    with values that reference stored fields, including custom fields,
                    on the `Contact` -- for example:
                    `${Twilio.Contact.first_name}` or `${Twilio.Contact.my_custom_field}`.
                  oneOf:
                    - $ref: '#/components/schemas/MessageContentTextWithMedia'
                    - $ref: '#/components/schemas/MessageContentTemplate'
                    - $ref: '#/components/schemas/MessageContentChannelModules'
                from:
                  title: SendMessagesRequestFrom
                  description: The sending identity to associate with the Message(s).
                  oneOf:
                    - $ref: '#/components/schemas/MessageAddressSender'
                    - $ref: '#/components/schemas/AgentIdSender'
                    - $ref: '#/components/schemas/MessageAgentPoolIdSender'
                schedule:
                  x-twilio-version: 1
                  $ref: '#/components/schemas/Schedule'
                tags:
                  x-twilio-version: 1
                  $ref: '#/components/schemas/Tags'
              required:
                - to
                - content
            examples:
              SendSimplestSms:
                summary: Send simplest sms
                value:
                  to:
                    - address: '+14153902337'
                      channel: phone
                  content:
                    text: Hello, World!
              SendASimpleSms:
                summary: Send a simple sms
                value:
                  from:
                    address: '+14153901002'
                    channel: sms
                  to:
                    - address: '+12065558844'
                      channel: phone
                  content:
                    text: Hello, World!
              SendAMessageToOneRecipientWaRcsMmsSmsThatHasMultipleAddresses:
                summary: Send a Message to one recipient (wa, rcs, mms, sms) that has multiple addresses
                value:
                  from:
                    address: '+14153901002'
                    channel: sms
                  to:
                    - addresses:
                        - address: '+12065558844'
                          channel: whatsapp
                        - address: '+12065558844'
                          channel: phone
                  content:
                    text: Hello, World!
              SendOneMessageFromAgentToContact:
                summary: Send one Message from Agent to Contact
