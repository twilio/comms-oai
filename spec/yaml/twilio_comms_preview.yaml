      description: A reference to a Profile
      type: string
      pattern: ^mem_profile_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: mem_profile_01h9krwprkeee8fzqspvwy6nq8
    EmailStatus:
      title: EmailStatus
      description: |-
        The status of an `Email`. The status can be one of the following:
        - `SCHEDULED` The `Email` is scheduled to be sent by
          Twilio in the future.

        - `QUEUED` The `Email` is queued in Twilio for sending.
        - `SENT` The `Email` has been sent by Twilio.
        - `DELIVERED` The `Email` has been successfully
            delivered to the recipient.

        - `UNDELIVERED` The `Email` was successfully sent by Twilio
            but has not been delivered to the recipient.

        - `OPENED` The `Email` has been opened by the recipient.
        - `FAILED` The `Email` processing failed inside Twilio.
        - `CANCELED` The `Email` was canceled via API request.
        - `INBOUND` The `Email` was received by Twilio from an external source.
      type: string
      enum:
        - SCHEDULED
        - QUEUED
        - SENT
        - DELIVERED
        - UNDELIVERED
        - OPENED
        - FAILED
        - CANCELED
        - INBOUND
    TagsString:
      title: TagsString
      type: string
      description: |-
        Custom metadata in the form of key-value pairs.
        Must be in the key value format: key1:value;key2:value;

        Example:
        ```json
        {
          "key1":"value1",
          "key2":"value2"
        }
        ```

        Should be inputted as:
        ```
        ?tags=key1:value;key2:value;
        ```
      pattern: ^(?:[a-zA-Z0-9._~-]+:[a-zA-Z0-9._~-]+;){1,10}$
      example: key_1:value;key_2:value;
    PageToken:
      description: The token that identifies the page of resources to fetch.
      title: PageToken
      type: string
    PageSize:
      description: Total number of items returned in a single page, the minimum is 1 and maximum is 1000. Default is 50.
      title: PageSize
      type: integer
      minimum: 1
      maximum: 1000
      default: 50
      example: 50
    EmailId:
      title: EmailId
      description: A reference to an Email.
      type: string
      pattern: ^comms_email_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_email_01h9krwprkeee8fzqspvwy6nq8
    EmailAddress:
      title: EmailAddress
      description: An email address and associated name.
      type: object
      properties:
        address:
          type: string
          description: The email address of the person or entity.
          format: email
        name:
          type: string
          description: The name of the person or entity.
      required:
        - address
      additionalProperties: false
    MemoryStoreId:
      title: MemoryStoreId
      description: A reference to a Memory Store
      type: string
      pattern: ^mem_store_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: mem_store_00000000000000000000000000
    EmailProfile:
      title: EmailProfile
      description: An email Profile is a person or entity identified by an email address and associated with a Profile ID and Memory Store ID.
      type: object
      properties:
        address:
          description: The email address of the Profile.
          type: string
        name:
          description: The name of the profile (e.g. "Acme Corp")
          type: string
        profileId:
          $ref: '#/components/schemas/ProfileId'
        memoryStoreId:
          $ref: '#/components/schemas/MemoryStoreId'
      required:
        - address
        - profileId
        - memoryStoreId
    SenderId:
      description: A reference to a Sender.
      title: SenderId
      type: string
      pattern: ^comms_sender_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_sender_01h9krwprkeee8fzqspvwy6nq8
    EmailSenderIdSender:
      title: EmailSenderIdSender
      description: An email sender identified by Sender Id.
      type: object
      properties:
        address:
          description: The email address of the person or entity.
          type: string
        name:
          description: The name of the person or entity associated with the email address.
          type: string
        senderId:
          $ref: '#/components/schemas/SenderId'
      required:
        - address
        - senderId
    RelatedResource:
      title: RelatedResource
      type: object
      description: A reference to a related resource.
      properties:
        name:
          type: string
          description: The name of the related resource.
          enum:
            - EMAIL
            - MESSAGE
            - PUSH_NOTIFICATION
            - SESSION
            - MEDIA
            - SENDER
            - SENDER_POOL
            - OPERATION
            - ENGAGEMENT
            - CREDENTIAL
            - PUSH_NOTIFICATION_APP
            - PUSH_NOTIFICATION_USER
            - DEVICE_REGISTRATION
        id:
          description: The identifier of the related resource.
          type: string
        uri:
          description: The path to the related resource.
          type: string
    Tags:
      title: Tags
      type: object
      description: |-
        Custom metadata in the form of key-value pairs.
        Maximum size of a tag key is 128 characters.
        Maximum size of a tag value is 256 characters.
        There can be a maximum of 10 key-value pairs.

        This field can be templated with [Liquid](https://shopify.github.io/liquid/).
        Specify `variables` with each recipient for personalization.
      maxProperties: 10
      propertyNames:
        type: string
        maxLength: 128
        pattern: ^[a-zA-Z0-9._~-]+$
      additionalProperties:
        type: string
        maxLength: 256
        pattern: ^[a-zA-Z0-9._~-]+$
    EmailBase:
      title: EmailBase
      type: object
      description: The atomic unit of communication for the email channel.
      properties:
        id:
          $ref: '#/components/schemas/EmailId'
        from:
          title: EmailFrom
          description: The sender of the email.
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - $ref: '#/components/schemas/EmailProfile'
            - $ref: '#/components/schemas/EmailSenderIdSender'
        to:
          title: EmailRecipients
          description: The recipients of the email on the `to` line.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/EmailAddress'
              - $ref: '#/components/schemas/EmailProfile'
              - $ref: '#/components/schemas/EmailSenderIdSender'
        replyTo:
          title: EmailReplyToRecipients
          description: The recipients set on the reply-to line of the email.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/EmailAddress'
              - $ref: '#/components/schemas/EmailProfile'
              - $ref: '#/components/schemas/EmailSenderIdSender'
        cc:
          title: EmailCCRecipients
          description: The recipients of the email on the `cc` line.
          type: array
          maxItems: 50
          items:
            oneOf:
              - $ref: '#/components/schemas/EmailAddress'
              - $ref: '#/components/schemas/EmailProfile'
              - $ref: '#/components/schemas/EmailSenderIdSender'
        bcc:
          title: EmailBCCRecipients
          description: The recipients of the email on the `bcc` line.
          type: array
          maxItems: 50
          items:
            oneOf:
              - $ref: '#/components/schemas/EmailAddress'
              - $ref: '#/components/schemas/EmailProfile'
              - $ref: '#/components/schemas/EmailSenderIdSender'
        status:
          $ref: '#/components/schemas/EmailStatus'
        related:
          description: A list of resources that are associated with the Email.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        tags:
          $ref: '#/components/schemas/Tags'
        scheduledFor:
          description: |-
            The scheduled send time of the `Email`.
            This field is only present if the `Email` was created with a `schedule`.
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          description: The date and time when the Email was created.
          type: string
          format: date-time
        updatedAt:
          description: The date and time when the Email was last updated.
          type: string
          format: date-time
        deletedAt:
          description: The date and time when the Email was deleted.
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - from
        - to
        - status
        - related
        - tags
        - scheduledFor
        - createdAt
        - updatedAt
        - deletedAt
    EmailMetadata:
      title: EmailMetadata
      type: object
      description: The EmailMetadata provides information about the Email. Does not include the Content.
      allOf:
        - $ref: '#/components/schemas/EmailBase'
    PaginationMetadata:
      title: PaginationMetadata
      description: |-
        Metadata for paginated results. 
        This object contains two tokens to navigate through paginated results. 
        - Use `next` to retrieve the 'next' page in the result list.
        - Use `self` to retrieve the same page of the result list again. 
        - Supply the token in the `pageToken` query param.
      type: object
      properties:
        next:
          description: |-
            Token for the next page of results. 
            Supply the token in the `pageToken` query param.
          type:
            - string
            - 'null'
        self:
          description: |-
            Token for the current page of results. 
            Supply the token in the `pageToken` query param.
          type: string
      required:
        - next
        - self
    TwilioError:
      title: TwilioError
      type: object
      description: A generic error object communicating client and server side API errors.
      properties:
        code:
          type: integer
          description: The Twilio error code.
        message:
          type: string
          description: A human readable message describing the error.
        infoUrl:
          type: string
          format: uri
          description: A URL to a [Twilio error directory](https://www.twilio.com/docs/api/errors) page with more information about the error code.
        context:
          description: A JSON path that identifies the errant field.
          type:
            - string
            - 'null'
      required:
        - code
        - message
        - infoUrl
        - context
      example:
        code: 21614
        message: The address specified in the request is not a valid phone number.
        infoUrl: https://www.twilio.com/docs/api/errors/21614
        context: $.to[0].address
    TwilioErrors:
      title: TwilioErrors
      type: object
      properties:
        errors:
          description: A list of one or more Twilio API errors.
          type: array
          items:
            $ref: '#/components/schemas/TwilioError'
      required:
        - errors
      example:
        errors:
          - code: 21614
            message: The address specified in the request is not a valid phone number.
            infoUrl: https://www.twilio.com/docs/api/errors/21614
            context: $.to[0].address
          - code: 21617
            message: The concatenated message text exceeds the 1600 character limit
            infoUrl: https://www.twilio.com/docs/api/errors/21617
            context: $.content.text
    EmailAddressSender:
      title: EmailAddressSender
      description: An email address and associated name for a sender. The name is required for senders.
      type: object
      properties:
        address:
          type: string
          description: The email address of the person or entity.
          format: email
        name:
          type: string
          description: The name of the person or entity.
      required:
        - address
        - name
    SenderIdSender:
      title: SenderIdSender
      description: A reference to a Sender.
      type: object
      properties:
        senderId:
          $ref: '#/components/schemas/SenderId'
      required:
        - senderId
    ContentPersonalization:
      title: ContentPersonalization
      type: object
      description: To personalize content for each recipient, supply variables here with values to substitute into any [Liquid](https://shopify.github.io/liquid/) templated content string or pre-stored Content template.
      additionalProperties:
        type: string
    AudienceId:
      title: AudienceId
      description: A reference to an Audience.
      type: string
      pattern: ^aud_audience_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: aud_audience_01h9krwprkeee8fzqspvwy6nq8
    ProfileRecipient:
      title: ProfileRecipient
      description: A reference to a Profile & Memory Store.
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        memoryStoreId:
          $ref: '#/components/schemas/MemoryStoreId'
        variables:
          $ref: '#/components/schemas/ContentPersonalization'
      required:
        - profileId
        - memoryStoreId
    EmailAttachmentCid:
      title: EmailAttachmentCid
      type: string
      minLength: 1
      description: |-
        The Content-ID of the attachment file.

        This is used to reference the attachment inline within the HTML body of the email.

        For example, to reference an image attachment in the HTML body, use:
        `<img src="cid:yourContentIdHere" />`
    EmailAttachments:
      title: EmailAttachments
      description: A list of email attachments.
      type: array
      items:
        oneOf:
          - title: EmailAttachmentsData
            type: object
            description: An email attachment specified by raw data.
            properties:
              filename:
                type: string
                minLength: 1
                description: The name of the attachment file.
              contentType:
                type: string
                minLength: 1
                description: The MIME type of the attachment file.
              content:
                type: string
                format: byte
                description: |-
                  The base64-encoded content of the attachment file.

                  Note: Your full request must not exceed 5 MB in size.
              cid:
                $ref: '#/components/schemas/EmailAttachmentCid'
            required:
              - filename
              - contentType
              - content
    EmailHtmlContent:
      title: EmailHtmlContent
      type: object
      description: Specify the `text/html` email body.
      properties:
        html:
          type: string
          description: |-
            The HTML email body (`text/html` MIME).

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        text:
          type: string
          description: |-
            The plain-text email body (`text/plain` MIME) for clients that do not support HTML.
            If none is specified, Twilio will auto-create one from your HTML email body.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        subject:
          type: string
          description: |-
            The subject of the email.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        attachments:
          $ref: '#/components/schemas/EmailAttachments'
        headers:
          title: EmailHeadersContent
          type: object
          description: |-
            Custom email headers as key-value pairs.
            You may not override the following headers: `x-sg-id`, `x-sg-eid`,
            `received`, `dkim-signature`, `Content-Type`, `Content-Transfer-Encoding`,
            `To`, `From`, `Subject`, `Reply-To`, `CC`, `BCC`.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
          additionalProperties:
            type: string
      required:
        - html
        - subject
    Schedule:
      title: Schedule
      description: A schedule defines *when* a communication will be sent to a recipient.
      type: object
      properties:
        sendAt:
          description: |-
            List of expressions for when the communication may be sent.

            The supported expression formats are:
              - RFC 3339 date-time string. e.g `"2025-11-11T11:11:00Z"`

            The maximum time you can schedule a communication is 30 days in the future.

            Currently, you may specify only a single expression.
            If you specify multiple expressions, only the first will be used.
            Support for additional scheduling expression formats may be added in the future.
          type: array
          items:
            type: string
      minProperties: 1
      additionalProperties: false
    OperationLocation:
      type: string
      format: uri
      description: The location (uri) of the Operation resource identified by `operationId`.
    Http202ResponseWithOperationBody:
      title: Http202ResponseWithOperationBody
      description: Response body for HTTP 202 response with Operation data.
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/OperationId'
        operationLocation:
          $ref: '#/components/schemas/OperationLocation'
      required:
        - operationId
        - operationLocation
    MimeType:
      title: MimeType
      type: string
      example: text/plain
      default: text/plain
      description: A MIME type (or "media type") identifies the type of data of an object.
    Media:
      title: Media
      type: object
      description: A document, image or other type of file attached to a message, email or push notification.
      properties:
        fileName:
          type: string
          description: The name of the media file.
        fileSize:
          type: number
          description: The size of the media file in bytes.
        mimeType:
          $ref: '#/components/schemas/MimeType'
        contentReference:
          title: MediaContentReference
          type: object
          description: The reference to the content of the media file.
          properties:
            temporaryUrl:
              type: string
              description: A temporary, expiring URL that can be used to access the media file.
              format: uri
            expiresAt:
              type: string
              description: The time at which the temporary URL expires.
              format: date-time
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - fileName
        - fileSize
        - mimeType
        - contentReference
        - updatedAt
        - createdAt
    EmailContentResolved:
      title: EmailContentResolved
      description: The resolved content of the Email.
      type: object
      properties:
        subject:
          type: string
          description: The subject of the email.
        text:
          type: string
          description: |-
            The plain-text email body (`text/plain` MIME).
            The string can be parameterized and supplied with `variables` for per-recipient personalization.
        html:
          type: string
          description: |-
            The HTML email body (`text/html` MIME).
            The string can be parameterized and supplied with `variables` for per-recipient personalization.
        attachments:
          type: array
          description: An array of objects where you can specify any attachments you want to include.
          items:
            $ref: '#/components/schemas/Media'
      required:
        - text
    Email:
      title: Email
      type: object
      description: The atomic unit of communication for the email channel.
      allOf:
        - $ref: '#/components/schemas/EmailBase'
        - title: EmailContent
          type: object
          properties:
            content:
              $ref: '#/components/schemas/EmailContentResolved'
          required:
            - content
    ResourceLocation:
      type: string
      format: uri
      description: The location (uri) of the resource identified by `Resource-Id`.
    ResourceId:
      type: string
      description: |-
        The Resource ID is an identifier for the resource that was created or updated
          in response to the request.
    Http202ResponseWithResourceBody:
      title: Http202ResponseWithResourceBody
      description: Response body for HTTP 202 response with Resource data.
      type: object
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        resourceLocation:
          $ref: '#/components/schemas/ResourceLocation'
      required:
        - resourceId
        - resourceLocation
    CommunicationOperationStatus:
      title: CommunicationOperationStatus
      type: string
      description: The status of an Operation.
      enum:
        - SCHEDULED
        - PROCESSING
        - COMPLETED
        - CANCELED
    EmailOperationStats:
      title: EmailOperationStats
      type: object
      example:
        total: 1
        recipients: 1
        attempts: 1
        queued: 0
        sent: 0
        scheduled: 0
        delivered: 0
        opened: 0
        undelivered: 0
        failed: 0
        canceled: 0
      description: |-
        Represents the stats of a sending operation of one or many `Emails`.
        - `total` is the total number of `Email` resources created in the `Operation`.

          * To get the status for each individual `Email`, fetch the `Email` resource:
            `GET /Email/{emailId}`.

          * For `Emails` with multiple recipients, use `Receipts` e.g. `GET /Emails/{emailId}/Receipts`.

        - `recipients` is the total number of recipients targeted in an Operation.
        - `attempts` is the total number of sending attempts made by Twilio.
        - `scheduled` is the number of `Emails` that are scheduled to be sent by
          Twilio in the future.

        - `queued` is the number of `Emails` that are queued in Twilio for sending.
        - `sent` is the number of `Emails` that have been sent by Twilio.
        - `delivered` is the number of `Emails` that have been successfully
            delivered to recipients.

        - `opened` is the number of `Emails` that have been opened by unique recipients.
        - `undelivered` is the number of `Emails` that were successfully sent by Twilio
          but have not been delivered to the recipient.

        - `failed` is the number of `Emails` that failed during processing by Twilio.
          Get `Errors` with `GET /Emails/Operations/{operationId}/Errors` fore more detail.

        - `canceled` is the number of `Emails` that were canceled via API request.
      properties:
        total:
          type: integer
          minimum: 0
        recipients:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        opened:
          type: integer
          minimum: 0
        undelivered:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
      required:
        - total
        - recipients
        - attempts
        - queued
        - sent
        - scheduled
        - delivered
        - opened
        - failed
        - undelivered
        - canceled
    EmailOperation:
      title: EmailOperation
      type: object
      description: |-
        An Email Operation represents the aggregate work to be completed for a POST request to the /Emails endpoint.
        The work maybe be performed asynchronously and the Email Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/CommunicationOperationStatus'
        stats:
          $ref: '#/components/schemas/EmailOperationStats'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - createdAt
        - updatedAt
    SessionId:
      title: SessionId
      description: A reference to a Session.
      type: string
      pattern: ^comms_session_[a-hjkmnpqrstv-z0-9]{26,34}
      example: comms_session_01h9krwprkeee8fzqspvwy6nq8
    MessageSenderChannel:
      title: MessageSenderChannel
      description: The channels available for Message entity.
      type: string
      enum:
        - SMS
        - RCS
        - WHATSAPP
        - APPLE
      example: SMS
    MessageStatus:
      title: MessageStatus
      description: |-
        The status of a `Message`. The status can be one of the following:
        - `SCHEDULED` The `Message` is scheduled to be sent by
          Twilio in the future.

        - `QUEUED` The `Message` is queued in Twilio for sending.
        - `SENT` The `Message` has been sent by Twilio.
        - `DELIVERED` The `Message` has been successfully
            delivered to the recipient.

        - `READ` The `Message` has been read by the recipient.
        - `UNDELIVERED` The `Message` was successfully sent by Twilio
          but have not been delivered to the recipient.

        - `FAILED` The `Message` processing failed inside Twilio.
          Use `GET /Messages/Operations/{operationId}/Errors` for more details.

        - `CANCELED` The `Message` was canceled via API request.
        - `GROUP` The `Message` is part of a group communication.
          To get the status for each Recipient of the group communication, use the `Receipts` endpoint
          e.g. GET `/Messages/comms_message_01h2xcejqtf2nbrexx3vqjhp41/Receipts`

        - `INBOUND` The `Message` was received by Twilio from an external source.
      type: string
      enum:
        - QUEUED
        - SENT
        - SCHEDULED
        - DELIVERED
        - READ
        - FAILED
        - UNDELIVERED
        - CANCELED
        - GROUP
        - INBOUND
    MessageId:
      description: A reference to a Message.
      title: MessageId
      type: string
      pattern: ^comms_message_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_message_01h9krwprkeee8fzqspvwy6nq8
    MessageSender:
      title: MessageSender
      description: A Message Sender is a person or entity whose communication identity is hosted by Twilio.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for a Sender (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageSenderChannel'
        senderId:
          $ref: '#/components/schemas/SenderId'
      required:
        - address
        - channel
        - senderId
      additionalProperties: false
    SenderPoolId:
      description: A reference to a SenderPool.
      title: SenderPoolId
      type: string
      pattern: ^comms_senderpool_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_senderpool_01h9krwprkeee8fzqspvwy6nq8
    MessageSenderAndPool:
      title: MessageSenderAndPool
      description: A Message Sender is a person or entity whose communication identity is hosted by Twilio. The `senderPoolId` field indicates the pool for which the `Sender` was resolved from.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for a Sender (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageSenderChannel'
        senderId:
          $ref: '#/components/schemas/SenderId'
        senderPoolId:
          $ref: '#/components/schemas/SenderPoolId'
      required:
        - address
        - channel
        - senderId
        - senderPoolId
    MessageProfileChannel:
      title: MessageProfileChannel
      description: |-
        The channels available for specifying a Message Profile.

        - `PHONE`: Includes SMS, MMS, and RCS, pair it with a phone number in the `address` field.

        - `WHATSAPP`: WhatsApp channel, pair it with a WhatsApp number in the `address` field.
      type: string
      enum:
        - PHONE
        - WHATSAPP
        - APPLE
      example: PHONE
    MessageProfile:
      title: MessageProfile
      description: A Message Profile is a person or entity that is not hosted by Twilio.
      type: object
      properties:
        address:
          description: The identifier within a channel address space for a Profile (e.g. phone number)
          type: string
        channel:
          $ref: '#/components/schemas/MessageProfileChannel'
        profileId:
          $ref: '#/components/schemas/ProfileId'
        memoryStoreId:
          $ref: '#/components/schemas/MemoryStoreId'
      required:
        - address
        - channel
        - profileId
        - memoryStoreId
      additionalProperties: false
    MessageAddressChannel:
      title: MessageAddressChannel
      description: |-
        The corresponding channel name for a Message address.

        - `PHONE`: Includes SMS, MMS, and RCS, pair it with a phone number in the `address` field.

        - `WHATSAPP`: WhatsApp channel, pair it with a WhatsApp number in the `address` field.
      type: string
      enum:
        - PHONE
        - WHATSAPP
        - APPLE
      example: PHONE
    MessageAddress:
      title: MessageAddress
      description: A messaging address and channel.
      type: object
      properties:
        address:
          type: string
          description: The communication address within a Messaging channel, such as a phone number.
        channel:
          $ref: '#/components/schemas/MessageAddressChannel'
      required:
        - address
        - channel
      additionalProperties: false
    MessageBase:
      title: MessageBase
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MessageId'
        from:
          title: MessageFrom
          description: The sender of the Message.
          oneOf:
            - $ref: '#/components/schemas/MessageSender'
            - $ref: '#/components/schemas/MessageSenderAndPool'
            - $ref: '#/components/schemas/MessageProfile'
            - $ref: '#/components/schemas/MessageAddress'
        to:
          title: MessageRecipients
          description: |-
            The list of recipient(s) that the Message was directed to. 

            - This list is always of size 1, except for Group Messaging usage, 
            where the number of recipients plus the sender will match the group size.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageAddress'
              - $ref: '#/components/schemas/MessageSender'
              - $ref: '#/components/schemas/MessageProfile'
        status:
          $ref: '#/components/schemas/MessageStatus'
        related:
          title: MessageRelatedResources
          description: A list of resources that are associated with the Message.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        tags:
          $ref: '#/components/schemas/Tags'
        createdAt:
          description: The date and time when the entity was created.
          type: string
          format: date-time
        updatedAt:
          description: The date and time when the entity was last updated.
          type: string
          format: date-time
        scheduledFor:
          description: |-
            The scheduled send time of the `Message`.
            This field is only present if the `Message` was created with a `schedule`.
          type:
            - string
            - 'null'
      required:
        - id
        - from
        - to
        - status
        - related
        - tags
        - scheduledFor
        - createdAt
        - updatedAt
        - deletedAt
    MessageMetadata:
      title: MessageMetadata
      type: object
      description: The MessageMetadata provides information about the Message but does not include the Content or Attempts.
      allOf:
        - $ref: '#/components/schemas/MessageBase'
    MediaUrl:
      title: MediaUrl
      type: object
      description: A publicly accessible URL of a media file (image, etc.) to include in the message. The media file will be copied to Twilio's servers and then sent to the recipient.
      properties:
        url:
          type: string
          minLength: 1
          description: |-
            The publicly accessible URL of the media file to copy.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
      required:
        - url
    ContentMediaInput:
      title: ContentMediaInput
      type: array
      description: |-
        A list of Media (images, etc.) to include in the message.

        Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

        Specify `variables` with each recipient for personalization.
      items:
        $ref: '#/components/schemas/MediaUrl'
    MessageContentTextWithMedia:
      title: MessageContentTextWithMedia
      type: object
      description: The text and media content of a `Message`.
      properties:
        text:
          type: string
          minLength: 1
          description: |-
            A simple content string (formerly called 'body').

            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization.
        media:
          description: |-
            A list of Media (images, etc.) to include in the message.

            If this field is specified, Twilio will attempt to send the `Message` as an MMS.

            Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

            Specify `variables` with each recipient for personalization.
          $ref: '#/components/schemas/ContentMediaInput'
      additionalProperties: false
      minProperties: 1
    ContentId:
      description: A reference to a Content template.
      title: ContentId
      type: string
      pattern: ^HX[a-zA-Z0-9]{26,34}$
      example: HX78e8e67fc0246521490fb9907fd0c165
    MessageContentTemplate:
      title: MessageContentTemplate
      description: A reference to a stored Content template  that can be used to generate content for a Message.
      type: object
      properties:
        contentId:
          $ref: '#/components/schemas/ContentId'
      required:
        - contentId
    MessageContentSms:
      title: MessageContentSms
      description: The text and media content of the SMS/MMS `Message`. If media is provided, Twilio will attempt to send the message as an MMS.
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: |-
            A simple content string (formerly called 'body').

            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization.
        media:
          description: |-
            A list of Media (images, etc.) to include in the message.

            If this field is specified, Twilio will attempt to send the `Message` as an MMS.

            Use `MediaUrl` to supply links to media files with templated URLs, using [Liquid](https://shopify.github.io/liquid/).

            Specify `variables` with each recipient for personalization.
          $ref: '#/components/schemas/ContentMediaInput'
      additionalProperties: false
      minProperties: 1
    MessageContentModuleSms:
      title: MessageContentModuleSms
      description: |-
        The `sms` (includes mms) content module for Messages.
        For RCS use `MessageContentModuleRcs`.
      type: object
      properties:
        sms:
          description: The `sms` (includes mms) content module for Messages.
          $ref: '#/components/schemas/MessageContentSms'
      required:
        - sms
    MessageContentRcsSuggestionPostbackData:
      title: MessageContentRcsSuggestionPostbackData
      description: The postback data to send when the suggestion item is selected.
      type: string
      minLength: 1
    MessageContentRcsDialAction:
      title: MessageContentRcsDialAction
      description: An RCS suggested action of type Dial.
      type: object
      properties:
        phoneNumber:
          type: string
          description: The phone number to call when the action is triggered.
      required:
        - phoneNumber
    MessageContentRcsOpenUrlAction:
      title: MessageContentRcsOpenUrlAction
      description: An RCS action of type Open Url.
      type: object
      properties:
        url:
          title: MessageContentRcsOpenUrlActionUrl
          type: string
          description: The url to open when the suggested action is selected.
        application:
          title: MessageContentRcsOpenUrlActionApplication
          type: string
          description: The application to use when opening the URL.
          enum:
            - BROWSER
            - WEBVIEW
        webviewViewMode:
          title: MessageContentRcsOpenUrlActionWebviewViewMode
          type: string
          description: |-
            The view mode for the webview.
            Required field (and only applicable) when application is `WEBVIEW`.
          enum:
            - FULL
            - HALF
            - TALL
      required:
        - url
    MessageContentRcsLatLng:
      title: MessageContentRcsLatLng
      description: A geographic coordinate (latitude and longitude).
      type: object
      properties:
        latitude:
          type: number
          description: The latitude in degrees. Must be in the range [-90.0, +90.0].
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: The longitude in degrees. Must be in the range [-180.0, +180.0].
          minimum: -180
          maximum: 180
      required:
        - latitude
        - longitude
    MessageContentRcsViewLocationAction:
      title: MessageContentRcsViewLocationAction
      description: An RCS action that opens a map to display a location. Either latLong or query should be provided.
      type: object
      properties:
        latLong:
          $ref: '#/components/schemas/MessageContentRcsLatLng'
        label:
          type: string
          description: The label of the pin dropped at the specified latLong.
        query:
          type: string
          description: A query string for a location search. If specified instead of latLong, the device performs a location search centered on the user's current location. (Android Only)
      minProperties: 1
      additionalProperties: false
    MessageContentRcsCreateCalendarEventAction:
      title: MessageContentRcsCreateCalendarEventAction
      description: An RCS action that creates a calendar event on the user's device.
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          description: The start time of the calendar event.
        endTime:
          type: string
          format: date-time
          description: The end time of the calendar event.
        title:
          type: string
          minLength: 1
          description: The title of the calendar event.
        description:
          type: string
          minLength: 1
          description: The description of the calendar event.
      required:
        - startTime
        - endTime
        - title
        - description
    MessageContentRcsShareLocationAction:
      title: MessageContentRcsShareLocationAction
      description: An RCS action that opens the device's location chooser, allowing the user to pick a location to send to the agent.
      type: object
      additionalProperties: false
    MessageContentRcsSuggestedAction:
      title: MessageContentRcsSuggestedAction
      description: An RCS action suggestion.
      type: object
      properties:
        action:
          title: MessageContentRcsAction
          description: The RCS action to suggest.
          type: object
          oneOf:
            - title: MessageContentRcsSuggestedActionDial
              type: object
              description: A action item that when selected by the recipient, initiates a voice call using the native calling app on the device.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionDialText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postbackData:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                dialAction:
                  $ref: '#/components/schemas/MessageContentRcsDialAction'
              required:
                - text
                - postbackData
                - dialAction
            - title: MessageContentRcsSuggestedActionOpenUrl
              type: object
              description: A action item, that when selected by the recipient, opens the provided `url` on the end-users device.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionOpenUrlText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postbackData:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                openUrlAction:
                  $ref: '#/components/schemas/MessageContentRcsOpenUrlAction'
              required:
                - text
                - postbackData
                - openUrlAction
            - title: MessageContentRcsSuggestedActionViewLocation
              type: object
              description: An action item that when selected by the recipient, opens a map to display a location.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionViewLocationText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postbackData:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                viewLocationAction:
                  $ref: '#/components/schemas/MessageContentRcsViewLocationAction'
              required:
                - text
                - postbackData
                - viewLocationAction
            - title: MessageContentRcsSuggestedActionCreateCalendarEvent
              type: object
              description: An action item that when selected by the recipient, creates a calendar event on the device.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionCreateCalendarEventText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postbackData:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                createCalendarEventAction:
                  $ref: '#/components/schemas/MessageContentRcsCreateCalendarEventAction'
              required:
                - text
                - postbackData
                - createCalendarEventAction
            - title: MessageContentRcsSuggestedActionShareLocation
              type: object
              description: An action item that when selected by the recipient, opens the device's location chooser to share a location with the agent.
              properties:
                text:
                  title: MessageContentRcsSuggestedActionShareLocationText
                  description: The text to display for the action item.
                  type: string
                  minLength: 1
                postbackData:
                  $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
                shareLocationAction:
                  $ref: '#/components/schemas/MessageContentRcsShareLocationAction'
              required:
                - text
                - postbackData
                - shareLocationAction
      required:
        - action
    MessageContentRcsSuggestedReply:
      title: MessageContentRcsSuggestedReply
      type: object
      description: An RCS reply suggestion.
      properties:
        reply:
          title: MessageContentRcsReply
          description: The RCS reply to suggest.
          type: object
          properties:
            text:
              title: MessageContentRcsReplyText
              description: The text to display for the suggested reply.
              type: string
              minLength: 1
            postbackData:
              $ref: '#/components/schemas/MessageContentRcsSuggestionPostbackData'
          required:
            - text
            - postbackData
      required:
        - reply
    MessageContentRcsSuggestions:
      title: MessageContentRcsSuggestions
      description: A list of RCS suggestions to display. Maximum 11 suggestions.
      type: array
      maxItems: 11
      items:
        oneOf:
          - $ref: '#/components/schemas/MessageContentRcsSuggestedAction'
          - $ref: '#/components/schemas/MessageContentRcsSuggestedReply'
    MessageContentRcsContentInfo:
      title: MessageContentRcsContentInfo
      description: An RCS Content Info.
      type: object
      properties:
        fileUrl:
          type: string
          description: The URL of the media file.
        thumbnailUrl:
          type: string
          description: The URL of the thumbnail image for the media.
        forceRefresh:
          type: boolean
          default: false
          description: If set to true, the content is fetched from the URL even if cached content is available. Forces a cache refresh for the media content.
      required:
        - fileUrl
    MessageContentRcsMedia:
      title: MessageContentRcsMedia
      description: An RCS media.
      type: object
      properties:
        contentInfo:
          $ref: '#/components/schemas/MessageContentRcsContentInfo'
        height:
          description: The height of the media.
          type: string
          enum:
            - TALL
            - MEDIUM
            - SHORT
      required:
        - contentInfo
    MessageContentRcsCardContent:
      title: MessageContentRcsStandaloneCardContent
      description: The content of the standalone card.
      type: object
      properties:
        title:
          title: MessageContentRcsStandaloneCardTitle
          description: The title of the standalone card.
          type: string
          minLength: 1
        description:
          title: MessageContentRcsStandaloneCardDescription
          description: The description of the standalone card.
          type: string
          minLength: 1
        media:
          $ref: '#/components/schemas/MessageContentRcsMedia'
        suggestions:
          title: MessageContentRcsCardSuggestions
          description: A list of suggestions for the card. Maximum 4 suggestions per card.
          type: array
          maxItems: 4
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageContentRcsSuggestedAction'
              - $ref: '#/components/schemas/MessageContentRcsSuggestedReply'
      minProperties: 1
      additionalProperties: false
    MessageContentRcsCarouselCard:
      title: MessageContentRcsCarouselCard
      description: An RCS carousel card.
      type: object
      properties:
        cardWidth:
          title: MessageContentRcsCarouselCardWidth
          description: The width of the cards in the carousel.
          type: string
          enum:
            - SMALL
            - MEDIUM
        cardContents:
          title: MessageContentRcsCarouselCardContents
          description: The contents of the carousel card.
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/MessageContentRcsCardContent'
      required:
        - cardContents
    MessageContentRcsStandaloneCard:
      title: MessageContentRcsStandaloneCard
      description: An RCS standalone card.
      type: object
      properties:
        cardOrientation:
          title: MessageContentRcsStandaloneCardOrientation
          description: The orientation of the card. Horizontal cards require media and at least one of title, description, or suggestions.
          type: string
          enum:
            - HORIZONTAL
            - VERTICAL
          default: VERTICAL
        thumbnailImageAlignment:
          title: MessageContentRcsStandaloneCardThumbnailImageAlignment
          description: The alignment of the thumbnail image in horizontal cards. Only applicable when cardOrientation is HORIZONTAL.
          type: string
          enum:
            - LEFT
            - RIGHT
          default: RIGHT
        cardContent:
          $ref: '#/components/schemas/MessageContentRcsCardContent'
      required:
        - cardContent
    MessageContentModuleRcs:
      title: MessageContentModuleRcs
      description: The RCS content.
      type: object
      properties:
        rcs:
          title: MessageContentRcs
          description: |-
            The RCS content, follows the RCS Business Messaging `SenderContentMessage` format.
            For more information, see [RCS Business Messaging](https://developers.google.com/business-communications/rcs-business-messaging)
          type: object
          oneOf:
            - title: MessageContentModuleRcsText
              description: The RCS union Text content.
              type: object
              properties:
                text:
                  title: MessageContentRcsText
                  description: An RCS message simple text content.
                  type: string
                  minLength: 1
                suggestions:
                  $ref: '#/components/schemas/MessageContentRcsSuggestions'
              required:
                - text
            - title: MessageContentModuleRcsContentInfo
              type: object
              description: The RCS union Content Info content.
              properties:
                contentInfo:
                  $ref: '#/components/schemas/MessageContentRcsContentInfo'
                suggestions:
                  $ref: '#/components/schemas/MessageContentRcsSuggestions'
              required:
                - contentInfo
            - title: MessageContentModuleRcsRichCard
              description: The RCS union Rich Card content.
              type: object
              properties:
                richCard:
                  title: MessageContentRcsRichCard
                  description: An RCS rich card.
                  type: object
                  oneOf:
                    - title: MessageContentRcsRichCardCarousel
                      description: A carousel card.
                      type: object
                      properties:
                        carouselCard:
                          $ref: '#/components/schemas/MessageContentRcsCarouselCard'
                      required:
                        - carouselCard
                    - title: MessageContentRcsRichCardStandalone
                      description: A standalone card.
                      type: object
                      properties:
                        standaloneCard:
                          $ref: '#/components/schemas/MessageContentRcsStandaloneCard'
                      required:
                        - standaloneCard
                suggestions:
                  $ref: '#/components/schemas/MessageContentRcsSuggestions'
              required:
                - richCard
      required:
        - rcs
    MessageContentChannelModules:
      title: MessageContentChannelModules
      description: Define content with modules
      type: object
      properties:
        modules:
          title: MessageContentChannelModulesList
          description: |-
            A list of content `modules`.

            Each module targets a specific Message channel, allowing for different content to be sent
            depending on the channel used for sending the Message.
          type: array
          items:
            title: MessageContentChannelModule
            description: Content module.
            type: object
            oneOf:
              - $ref: '#/components/schemas/MessageContentModuleSms'
              - $ref: '#/components/schemas/MessageContentModuleRcs'
          minItems: 1
          maxItems: 4
      required:
        - modules
    MessageAddressSender:
      title: MessageAddressSender
      description: A messaging address and channel
      type: object
      properties:
        address:
          type: string
          description: The Sender’s communication address within a channel, such as a phone number, email address, or device token.
        channel:
          $ref: '#/components/schemas/MessageSenderChannel'
      required:
        - address
        - channel
    MessageSenderChannelControl:
      title: MessageSenderChannelControl
      description: Define controls to `filter` and `prioritize` Senders based on their `channel`.
      type: object
      properties:
        filterIn:
          title: MessageSenderChannelControlFilterIn
          description: |-
            A list of eligible channels to constrain `Sender` resolution to;
            leave undefined to send across all available channels.

            Warning: If there is no viable path from any `Sender` to a recipient resulting from
            this filter, no `Message` will be sent to the recipient(s)!
          type: array
          items:
            $ref: '#/components/schemas/MessageSenderChannel'
          uniqueItems: true
        priority:
          title: MessageSenderChannelControlPriority
          description: |-
            A list of channels and their priority for use. 
            Lowest numeric value is highest priority.
          type: array
          items:
            title: MessageSenderChannelControlPriorityItem
            description: A channel and its priority.
            properties:
              channel:
                $ref: '#/components/schemas/MessageSenderChannel'
              priority:
                type: integer
                description: |-
                  The priority of the channel. Lower values indicate higher priority.
                  For example, a value of `0` indicates the highest priority channel.
            required:
              - channel
              - priority
    MessageSenderPoolIdSender:
      title: MessageSenderPoolIdSender
      description: A reference to a `SenderPool` and optional channel controls.
      type: object
      properties:
        senderPoolId:
          $ref: '#/components/schemas/SenderPoolId'
        channels:
          $ref: '#/components/schemas/MessageSenderChannelControl'
      required:
        - senderPoolId
    MessageContentTextWithMediaResolved:
      title: MessageContentTextWithMediaResolved
      type: object
      properties:
        text:
          type: string
          description: A simple content string (formerly called 'body').
        media:
          type: array
          description: A list of Media objects (images, etc.) included in the Message.
          items:
            oneOf:
              - $ref: '#/components/schemas/Media'
              - $ref: '#/components/schemas/MediaUrl'
      additionalProperties: false
      minProperties: 1
    MessageContentResolved:
      title: MessageContentResolved
      description: The resolved content of the Message.
      type: object
      properties:
        content:
          description: The resolved content of the Message.
          oneOf:
            - $ref: '#/components/schemas/MessageContentTextWithMediaResolved'
            - $ref: '#/components/schemas/MessageContentTemplate'
            - $ref: '#/components/schemas/MessageContentChannelModules'
      required:
        - content
    TwilioErrorNullable:
      title: TwilioErrorNullable
      type:
        - object
        - 'null'
      description: A generic error object communicating client and server side API errors.
      properties:
        code:
          type: integer
          description: The Twilio error code.
        message:
          type: string
          description: A human readable message describing the error.
        infoUrl:
          type: string
          format: uri
          description: A URL to a [Twilio error directory](https://www.twilio.com/docs/api/errors) page with more information about the error code.
        context:
          description: A JSON path that identifies the errant field.
          type:
            - string
            - 'null'
      example:
        code: 21614
        message: The address specified in the request is not a valid phone number.
        infoUrl: https://www.twilio.com/docs/api/errors/21614
        context: $.from[0].address
    MessageAttempt:
      title: MessageAttempt
      description: The Message Attempt resource represents a single attempt to send a Message to a Recipient. A Message will have one or more Attempts depending on the processing and delivery outcome.
      type: object
      properties:
        from:
          title: MessageAttemptSender
          description: The sender of the Message Attempt.
          $ref: '#/components/schemas/MessageSender'
        to:
          title: MessageAttemptRecipients
          description: The recipients of the Message Attempt. This array will contain a single recipient element, except for GMMS use case, where there are multiple recipients.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageAddress'
              - $ref: '#/components/schemas/MessageProfile'
        status:
          $ref: '#/components/schemas/MessageStatus'
          description: The status of the Message Attempt. The status of the Message is the status of the last attempt.
        attemptedAt:
          type: string
          format: date-time
          description: The date and time when the Message Attempt began processing.
        infoUrl:
          type: string
          format: uri
          description: A URL to view more information for this Message Attempt.
        error:
          $ref: '#/components/schemas/TwilioErrorNullable'
          description: An error object that describes an error that occurred during the Message Attempt. This field will be `null` if the attempt was successful.
      required:
        - from
        - to
        - status
        - attemptedAt
        - infoUrl
        - error
    Message:
      title: Message
      description: A Message is the atomic unit of communication that may be used across all available channels.
      type: object
      allOf:
        - $ref: '#/components/schemas/MessageBase'
        - $ref: '#/components/schemas/MessageContentResolved'
        - title: MessageAttempts
          type: object
          description: The list of attempts Twilio executed to process the Message.
          properties:
            attempts:
              title: MessageAttemptsList
              description: The list of attempts Twilio executed to process the Message.
              type: array
              items:
                $ref: '#/components/schemas/MessageAttempt'
          required:
            - attempts
    MessageOperationStats:
      title: MessageOperationStats
      type: object
      example:
        total: 1
        recipients: 1
        attempts: 1
        queued: 0
        sent: 0
        scheduled: 0
        delivered: 0
        read: 0
        undelivered: 0
        unaddressable: 0
        failed: 0
        canceled: 0
      description: |-
        Represents the stats of a sending operation of one or many communications resources, such as Messages and Emails.
        - `total` is the total number of `Messages` in the `Operation`.

          * To get the status for each individual `Message`, fetch the resource with:
            `GET /Messages/{messageId}`.

          * For group communications, where there is more than one recipient per communication resource
            use `Receipts` e.g. `GET /Messages/{messageId}/Receipts`.

        - `recipients` is the total number of recipients targeted in an Operation.
        - `attempts` is the total number of sending attempts made by Twilio.
        - `unaddressable` is the number of recipients to which no sending attempts were made because
          a valid match could not be found between the available addresses for the recipient (`to`)
          and sender (`from`).

        - `scheduled` is the number of `Messages` that are scheduled to be sent by
          Twilio in the future.

        - `queued` is the number of `Messages` that are queued in Twilio for sending.
        - `sent` is the number of `Messages` that have been sent by Twilio.
        - `delivered` is the number of `Messages` that have been successfully
            delivered to recipients.

        - `read` is the number of `Messages` that have been read by recipients.
        - `undelivered` is the number of `Messages` that were successfully sent by Twilio
          but have not been delivered to the recipient.

        - `failed` is the number of `Messages` that failed during processing by Twilio.
          Get `Errors` with `GET /Messages/Operations/{operationId}/Errors` fore more detail.

        - `canceled` is the number of `Messages` that were canceled via API request.
      properties:
        total:
          type: integer
          minimum: 0
        recipients:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        undelivered:
          type: integer
          minimum: 0
        unaddressable:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
      required:
        - total
        - recipients
        - attempts
        - unaddressable
        - queued
        - sent
        - scheduled
        - delivered
        - read
        - failed
        - undelivered
        - canceled
    MessageOperation:
      title: MessageOperation
      type: object
      description: |-
        A Message Operation represents the aggregate work to be completed for a POST request to the /Messages endpoint.
        The work maybe be performed asynchronously and the Message Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/CommunicationOperationStatus'
        stats:
          $ref: '#/components/schemas/MessageOperationStats'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - createdAt
        - updatedAt
    PushNotificationUserId:
      title: PushNotificationUserId
      description: A reference to a Push Notification User.
      type: string
      pattern: ^comms_pushnotificationuser_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_pushnotificationuser_01h9krwprkeee8fzqspvwy6nq8
    PushNotificationAppName:
      title: PushNotificationAppName
      description: The name of the Push Notification `App`.
      type: string
      pattern: ^[a-z0-9_]+$
      minLength: 1
      maxLength: 64
    DeviceRegistrationId:
      title: DeviceRegistrationId
      description: A reference to a Device Registration.
      type: string
      pattern: ^comms_device_registration_[a-hjkmnpqrstv-z0-9]{26,34}$
      example: comms_device_registration_01h9krwprkeee8fzqspvwy6nq8
    PushNotificationProvider:
      title: PushNotificationProvider
      description: Push notification service provider.
      type: string
      enum:
        - APN
        - FCM
    Device:
      title: Device
      type: object
      description: A device is a physical device or a browser that can receive push notifications. A device is uniquely identified by its app-specific unique token and the push provider identifier.
      properties:
        token:
          type: string
          description: Push notifications token for the device/browser.
        provider:
          $ref: '#/components/schemas/PushNotificationProvider'
      required:
        - token
        - provider
    DeviceRegistration:
      title: DeviceRegistration
      type: object
      description: A registration is a collection of a User's devices registered under a single app. It is uniquely identified by the combination of the User's id and the app name. A device is a physical device or a browser that can receive push notifications. A device is uniquely identified by its app-specific unique token and the push provider identifier.
      properties:
        id:
          $ref: '#/components/schemas/DeviceRegistrationId'
        appName:
          type: string
          description: The name of the `App` that the device registrations are for.
        userId:
          $ref: '#/components/schemas/PushNotificationUserId'
        devices:
          type: array
          minItems: 1
          maxItems: 50
          description: List of devices registered in this set.
          items:
            $ref: '#/components/schemas/Device'
        related:
          description: A list of resources that are associated with this Device Registration.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
      required:
        - id
        - appName
        - userId
        - devices
        - related
    PushNotificationStatus:
      title: PushNotificationStatus
      description: |-
        The status of a `Push Notification` resource. The status can be one of the following:
        - `scheduled` The `Push Notification`  is scheduled to be sent by
          Twilio in the future.

        - `queued` The `Push Notification` is queued in Twilio for sending.
        - `sent` The `Push Notification` resource has been sent by Twilio.
        - `failed` The `Push Notification` resource processing failed inside Twilio.
          Use `GET /PushNotifications/Operations/{operationId}/Errors` for more details.

        - `canceled` The communication resource was canceled via API request.
      type: string
      enum:
        - SCHEDULED
        - QUEUED
        - SENT
        - FAILED
        - CANCELED
    PushNotificationId:
      title: PushNotificationId
      description: A reference to a PushNotification.
      type: string
      pattern: ^comms_pushnotification_[0-7][a-hjkmnpqrstv-z0-9]{25,34}
      example: comms_pushnotification_01h9krwprkeee8fzqspvwy6nq8
    CredentialId:
      title: CredentialId
      description: A reference to Credential.
      type: string
      pattern: ^comms_credential_[a-hjkmnpqrstv-z0-9]{26,34}
      example: comms_credential_01h9krwprkeee8fzqspvwy6nq8
    PushNotificationCredentialSender:
      title: PushNotificationCredentialSender
      description: |-
        For each supported provider, a `Credential.Id` can be provided.

        Ensure that the `Credential.credentialType`s of each `Credential`
        matches the name of the respective fields.
      type: object
      properties:
        fcm:
          $ref: '#/components/schemas/CredentialId'
        apn:
          $ref: '#/components/schemas/CredentialId'
      additionalProperties: false
    PushNotificationPriority:
      title: PushNotificationPriority
      description: The priority of the Push Notification. A value of "low" reduces the client app battery consumption. A value of "high" sends the notification immediately and can wake up a sleeping device.
      type: string
      enum:
        - HIGH
        - LOW
      default: HIGH
    PushNotificationBase:
      title: PushNotificationBase
      type: object
      description: A push notification is a short, ephemeral message sent to an Android device, iOS device or web browser session.
      properties:
        id:
          $ref: '#/components/schemas/PushNotificationId'
        from:
          description: The `credentialId` is used for authentication and authorization when sending the push notification through the respective channel.
          $ref: '#/components/schemas/PushNotificationCredentialSender'
        to:
          title: PushNotificationRecipient
          description: The recipient of the Push Notification
          oneOf:
            - title: PushNotificationTokenRecipient
              description: A recipient identified by a push token
              type: object
              properties:
                token:
                  type: string
                  description: Identifies a single device for delivering push notifications via the specified provider.
                provider:
                  $ref: '#/components/schemas/PushNotificationProvider'
              required:
                - token
                - provider
            - title: PushNotificationUserRecipient
              description: A recipient identified by their `userId`
              properties:
                userId:
                  x-twilio-version: 1
                  $ref: '#/components/schemas/PushNotificationUserId'
              required:
                - userId
        appName:
          $ref: '#/components/schemas/PushNotificationAppName'
          x-twilio-version: preview
        priority:
          $ref: '#/components/schemas/PushNotificationPriority'
        sound:
          type:
            - string
            - 'null'
          description: The name of the sound to be played for the push notification.
        related:
          description: A list of resources that are associated with the Push Notification.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        tags:
          x-twilio-version: preview
          $ref: '#/components/schemas/Tags'
        status:
          $ref: '#/components/schemas/PushNotificationStatus'
        scheduledFor:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          description: The date and time when the Push Notification was created, in ISO 8601 format.
          type: string
          format: date-time
        updatedAt:
          description: The date and time when the Push Notification was last updated, in ISO 8601 format.
          type: string
          format: date-time
      required:
        - id
        - to
        - from
        - status
        - createdAt
        - updatedAt
    PushNotificationMetadata:
      title: PushNotificationMetadata
      type: object
      description: The PushNotificationMetadata provides information about the PushNotification. Does not include the Content.
      allOf:
        - $ref: '#/components/schemas/PushNotificationBase'
    PushNotificationAppSender:
      title: PushNotificationAppSender
      type: object
      properties:
        appName:
          description: The name of the `App` to be used for sending the Push Notification(s)
          allOf:
            - $ref: '#/components/schemas/PushNotificationAppName'
      required:
        - appName
    SendPushNotificationDirectRecipient:
      title: SendPushNotificationDirectRecipient
      description: A push notification token and provider
      type: object
      properties:
        token:
          type: string
          description: Identifies a single device for delivering push notifications via the specified provider.
        provider:
          $ref: '#/components/schemas/PushNotificationProvider'
        variables:
          $ref: '#/components/schemas/ContentPersonalization'
      required:
        - token
        - provider
    SendPushNotificationsUserRecipient:
      type: object
      title: SendPushNotificationsUserRecipient
      properties:
        userId:
          $ref: '#/components/schemas/PushNotificationUserId'
        variables:
          $ref: '#/components/schemas/ContentPersonalization'
      required:
        - userId
    SendPushNotificationsAudienceRecipient:
      type: object
      title: SendPushNotificationsAudienceRecipient
      properties:
        audienceId:
          $ref: '#/components/schemas/AudienceId'
        variables:
          $ref: '#/components/schemas/ContentPersonalization'
      required:
        - audienceId
    PushNotificationContentApnPassthrough:
      title: PushNotificationContentApnPassthrough
      description: APNs-specific passthrough properties for push notifications.
      type: object
      properties:
        aps:
          title: ApnPassthroughRoot
          type: object
          description: The root APNs aps object. Can be extended with any properties.
          additionalProperties: true
      additionalProperties: true
    PushNotificationContentFcmPassthrough:
      title: PushNotificationContentFcmPassthrough
      description: FCM-specific passthrough properties for push notifications.
      type: object
      properties:
        message:
          title: FcmPassthroughRoot
          type: object
          description: The root FCM message object. Can be extended with any properties.
          additionalProperties: true
      required:
        - message
    PushNotificationContentPassthrough:
      title: PushNotificationContentPassthrough
      description: Provider-specific passthrough properties for push notifications. Use this object to supply advanced options for APNs, FCM, or other providers.
      type: object
      properties:
        apn:
          $ref: '#/components/schemas/PushNotificationContentApnPassthrough'
        fcm:
          $ref: '#/components/schemas/PushNotificationContentFcmPassthrough'
      additionalProperties: false
    PushNotificationContentBody:
      title: PushNotificationContentBody
      type: object
      description: Push Notification content with body.
      properties:
        title:
          type: string
          description: |-
            The title of the push notification. Defaults to the app name.

              
            This field can be templated with [Liquid](https://shopify.github.io/liquid/). Specify `variables` with each recipient for personalization.
        body:
          type: string
          description: |-
            A simple string or templated content.

            This field can be templated with [Liquid](https://shopify.github.io/liquid/).
            Specify `variables` with each recipient for personalization.
        providerPassthrough:
          $ref: '#/components/schemas/PushNotificationContentPassthrough'
      required:
        - body
    PushNotificationContentBodyResolved:
      title: PushNotificationContentBodyResolved
      type: object
      description: A resolved push notification content object with body.
      properties:
        title:
          type: string
          description: The title of the push notification. Defaults to the app name.
        body:
          type: string
          description: A simple content string.
      required:
        - body
    PushNotificationContentResolved:
      title: PushNotificationContentResolved
      description: The resolved content of the Push Notification.
      type: object
      properties:
        content:
          title: PushNotificationContent
          description: The content of the Push Notification.
          oneOf:
            - $ref: '#/components/schemas/PushNotificationContentBodyResolved'
      required:
        - content
    PushNotification:
      title: PushNotification
      type: object
      description: A push notification is a short, ephemeral message sent to an Android device, iOS device or web browser session.
      allOf:
        - $ref: '#/components/schemas/PushNotificationBase'
        - $ref: '#/components/schemas/PushNotificationContentResolved'
    PushNotificationOperationStats:
      title: PushNotificationOperationStats
      type: object
      example:
        total: 1
        recipients: 1
        queued: 0
        sent: 0
        scheduled: 0
        unaddressable: 0
        failed: 0
        canceled: 0
      description: |-
        Represents the stats of a sending operation of one or many `Push Notifications`.
        - `total` is the total number of `Push Notifications` in the `Operation`.

          * To get the status for each `Push Notification`, fetch the resource with:
            `GET /PushNotifications/{pushNotificationId}`.

        - `recipients` is the total number of recipients targeted in an Operation.
        - `unaddressable` is the number of recipients to which no sending attempts were made because
          a valid token could not be found in the recipient's `Device Registration` set for the
          `Credentials` or `App` provided.

        - `scheduled` is the number of `Push Notifications` that are scheduled to be sent by
          Twilio in the future.

        - `queued` is the number of `Push Notifications` that are queued in Twilio for sending.
        - `sent` is the number of `Push Notifications` that have been sent by Twilio.
        - `failed` is the number of `Push Notifications` that failed during processing by Twilio.
          Get `Errors` with `GET /PushNotifications/Operations/{operationId}/Errors` fore more detail.

        - `canceled` is the number of `Push Notifications` that were canceled via API request.
      properties:
        total:
          type: integer
          minimum: 0
        recipients:
          type: integer
          minimum: 0
        unaddressable:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
      required:
        - total
        - recipients
        - unaddressable
        - scheduled
        - queued
        - sent
        - failed
        - canceled
    PushNotificationOperation:
      title: PushNotificationOperation
      type: object
      description: |-
        A Push Notification Operation represents the aggregate work to be completed for a POST request to the /PushNotifications endpoint.
        The work maybe be performed asynchronously and the PushNotification Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/CommunicationOperationStatus'
        stats:
          $ref: '#/components/schemas/PushNotificationOperationStats'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - createdAt
        - updatedAt
    PushCredentialType:
      title: PushCredentialType
      description: The credential types available for PushNotifications.
      type: string
      enum:
        - APN
        - APN_SANDBOX
        - FCM
    AccountPushCredentialFlag:
      title: AccountPushCredentialFlag
      description: |-
        Use this Credential as the default for the Push Notification `App` for the
          given `credentialType` to send Push Notifications. 
        If a Credential of the given type doesn't already exist, 
          this Credential automatically becomes the default.
      type: boolean
      default: false
    PushNotificationCredential:
      title: PushNotificationCredential
      type: object
      description: Credential properties are specific to the channel type and provided by the vendor that supports it.
      properties:
        id:
          $ref: '#/components/schemas/CredentialId'
        credentialType:
          $ref: '#/components/schemas/PushCredentialType'
        isDefault:
          $ref: '#/components/schemas/AccountPushCredentialFlag'
        appName:
          type: string
          description: |-
            The name of the app that this Credential is associated with.
            This should be the same value as the `appName` set when registering devices for the app
            with `/PushNotifications/DeviceRegistrations`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - credentialType
        - isDefault
        - appName
        - createdAt
        - updatedAt
    ApnCertificatePushCredential:
      title: ApnCertificatePushCredential
      description: Certificate-based credentials are used to authenticate with the APN service before sending a Notification.  It can be acquired from the Apple Developer Portal. Note that certificates have an expiration date and need to be renewed before they expire. Alternatively, you can use APN Signing Key credentials.
      type: object
      properties:
        certificate:
          type: string
          format: byte
          description: The base64 representation of the certificate. Strip everything outside of the headers,  e.g. `-----BEGIN CERTIFICATE-----MIIFnTCCBIWgAwIBAgIIAjy9H849+E8wDQYJKoZIhvcNAQEFBQAwgZYxCzAJBgNV.....A==-----END CERTIFICATE-----` and encode with base64 encoding.
        privateKey:
          type: string
          format: byte
          description: The base64 representation of the private key. Strip everything outside of the headers,  e.g. `-----BEGIN RSA PRIVATE KEY-----MIIEpQIBAAKCAQEAuyf/lNrH9ck8DmNyo3fGgvCI1l9s+cmBY3WIz+cUDqmxiieR\n.-----END RSA PRIVATE KEY-----` and encode with base64 encoding.
      required:
        - privateKey
        - certificate
    FcmPushCredential:
      title: FcmPushCredential
      description: FCM credentials are used to authenticate with the Firebase Cloud Messaging service before sending a Notification. COMMS API uses this private key to authenticate with the FCM service before sending a Notification.
      type: object
      properties:
        privateKey:
          type: string
          format: byte
          description: The `privateKey` field is a JSON object that contains the Google Cloud private key, generated with minimal privileges,  specifically for Cloud Messaging on the Google Cloud Platform. It is recommended to follow the principle of least privilege  when generating this key to ensure security and limit potential misuse. The Google Cloud private key is in a JSON format and must be encoded with base64 before sending.
      required:
        - privateKey
      additionalProperties: false
    PushCredentialContent:
      title: PushCredentialContent
      description: Credential properties are specific to the channel type and provided by the vendor that supports it.
      oneOf:
        - $ref: '#/components/schemas/ApnCertificatePushCredential'
        - $ref: '#/components/schemas/FcmPushCredential'
    PushNotificationAppDefaultCredential:
      title: PushNotificationAppDefaultCredential
      type: object
      description: The default Credential for a `credentialType` (provider) for a Push Notification `App`
      properties:
        id:
          $ref: '#/components/schemas/CredentialId'
        credentialType:
          $ref: '#/components/schemas/PushCredentialType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - credentialType
        - createdAt
        - updatedAt
    PushNotificationApp:
      title: PushNotificationApp
      type: object
      properties:
        name:
          description: The name of the `App`. This is the unique identifier of the `App`.
          allOf:
            - $ref: '#/components/schemas/PushNotificationAppName'
        isDefault:
          type: boolean
          description: |-
            Whether this `App` is the default (Push Notification) App for the Account.
            The first `App` auto-created is automatically set as the default.
            To update the default `App`, use `PATCH /PushNotifications/Apps/{appName}`.
        defaultCredentials:
          type: array
          description: The default Credentials for this `App`.
          items:
            $ref: '#/components/schemas/PushNotificationAppDefaultCredential'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - isDefault
        - defaultCredentials
        - createdAt
        - updatedAt
    PushNotificationUser:
      title: PushNotificationUser
      type: object
      description: A User represents an end-user who can receive push notifications. Users can have multiple devices per Device Registration set and multiple Device Registration sets (one per App).
      properties:
        id:
          $ref: '#/components/schemas/PushNotificationUserId'
        related:
          title: PushNotificationUserRelatedResources
          description: A list of resources that are associated with the User.
          type: array
          items:
            $ref: '#/components/schemas/RelatedResource'
        createdAt:
          type: string
          format: date-time
          description: The date and time the User was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the User was last updated.
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The date and time the User was deleted, if applicable.
      required:
        - id
        - related
        - createdAt
        - updatedAt
        - deletedAt
    SenderCommunicationChannel:
      description: |-
        The medium which a unit of communication is transmitted through.
        These are differentiated by a mix of transmission protocol, network controller/owner, endpoint and address model,
        as well as the model for content of the atomic unit of communication itself.
      title: SenderCommunicationChannel
      type: string
      enum:
        - SMS
        - RCS
        - EMAIL
        - WHATSAPP
        - PUSH
        - APPLE
    SenderStatus:
      title: SenderStatus
      description: |-
        The status of a Sender.
        If a Sender is `activated`, it is available to send and receive communications.
        If a Sender is `deactivated`, it is not available to send or receive communications.
      type: string
      enum:
        - ACTIVATED
        - DEACTIVATED
    Sender:
      title: Sender
      description: |-
        A Sender is a sending and receiving communication identity associated with a Twilio application.
        For 'outbound' communications, it is used as the sender of the communication in the 'from' field.
        For 'inbound' communications (sent by an end-user), it is used as the recipient and populated in the 'to' field.
        A Sender represents existing inventory created and setup in other Twilio APIs, such as Phone Numbers.
      properties:
        id:
          $ref: '#/components/schemas/SenderId'
        displayName:
          type:
            - string
            - 'null'
          description: |-
            The name associated with the address inventory, such as phone number or email address.  

            This name might be visible to recipients in certain communications, such as Email, and helps identify the sender. 

            *Note:* To update this value, use the appropriate Twilio API for the inventory type. For example, for Senders with the channel `email`, update `displayName` using the EmailSenders API.
        address:
          type: string
          description: The Sender’s communication address within a channel, such as a phone number, email address, or device token.
        channel:
          $ref: '#/components/schemas/SenderCommunicationChannel'
        status:
          $ref: '#/components/schemas/SenderStatus'
        tags:
          $ref: '#/components/schemas/Tags'
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - address
        - channel
        - status
        - tags
        - updatedAt
        - createdAt
    CommunicationChannel:
      title: CommunicationChannel
      description: |-
        The medium which a unit of communication is transmitted through.
        These are differentiated by a mix of transmission protocol, network controller/owner, endpoint and address model,
        as well as the model for content of the atomic unit of communication itself.
      type: string
      enum:
        - EMAIL
        - PHONE
        - WHATSAPP
        - PUSH
    CommunicationRecipient:
      title: CommunicationRecipient
      type: object
      properties:
        address:
          description: The recipient’s communication address within a channel, such as a phone number, email address, or device token.
          type: string
        channel:
          $ref: '#/components/schemas/CommunicationChannel'
      required:
        - address
        - channel
    SenderCommunicationChannelControl:
      title: SenderChannelControl
      description: Define controls to filter and prioritize Senders based on their `channel`.
      type: object
      properties:
        filterIn:
          title: SenderChannelControlFilterIn
          description: |-
            A list of eligible channels to constrain `Sender` resolution to;
            leave undefined to send across all available channels.

            Warning: If there is no viable path from any `Sender` to a recipient resulting from
            this filter, no communication will be sent to the recipient(s)!
          type: array
          items:
            $ref: '#/components/schemas/SenderCommunicationChannel'
          uniqueItems: true
        priority:
          title: SenderChannelControlPriority
          description: |-
            A list of channels and their priority for use. 
            Lowest numeric value is highest priority.
          type: array
          items:
            title: SenderChannelControlPriorityItem
            description: A channel and its priority.
            type: object
            properties:
              channel:
                $ref: '#/components/schemas/SenderCommunicationChannel'
              priority:
                type: integer
                description: |-
                  The priority of the channel. Lower values indicate higher priority.
                  For example, a value of `0` indicates the highest priority channel.
            required:
              - channel
              - priority
    SenderPool:
      title: SenderPool
      description: |-
        A SenderPool is a set of sending (and receiving) identities associated with a Twilio application.
        It can contain one or more Senders for use in multi-channel use-cases or to achieve pooling functionalities.
        For 'outbound' communications, it is used as the sender of the communication in the 'from' field.
        For 'inbound' communications sent by an end-user, it is used as the recipient, and populated in the 'to' field.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SenderPoolId'
        name:
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - tags
        - createdAt
        - updatedAt
    OperationStatus:
      title: OperationStatus
      type: string
      description: The status of an Operation.
      enum:
        - PROCESSING
        - COMPLETED
        - CANCELED
    SenderPoolOperation:
      title: SenderPoolOperation
      type: object
      description: |-
        A SenderPool Operation represents the aggregate work to be completed when creating and modifying SenderPools by adding or removing Senders.
        The work maybe be performed asynchronously and the Sender Pool Operation resource can be used to track the progress of the work.
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/OperationStatus'
        stats:
          title: SenderPoolOperationStats
          type: object
          properties:
            total:
              type: integer
              minimum: 0
            queued:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
          required:
            - total
            - queued
            - created
            - failed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - stats
        - createdAt
        - updatedAt
