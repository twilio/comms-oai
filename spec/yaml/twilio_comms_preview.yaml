openapi: 3.1.0
info:
  title: Twilio Communications API
  version: preview
  contact:
    name: Twilio
    url: https://www.twilio.com
  x-logo:
    url: /docs.svg
  description: A comprehensive communications API for connecting people through software.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://comms.twilio.com/preview
    description: Twilio Communications API preview
security:
  - accountIdAuthToken: []
  - apiKeyApiKeySecret: []
tags:
  - name: Messages
    description: |-
      *Use `Messages` to send and receive RCS, SMS and MMS, and WhatsApp messages.*

      *Send with precise control over every aspect of your message
       or let Twilio share control and up-level your messaging with data-driven optimizations.*
  - name: Emails
    description: '*Use `Emails` to send and receive email with Twilio SendGrid.*'
  - name: PushNotifications
    description: |-
      *Use `PushNotifications` to send push notifications to your mobile apps
      via Firebase Cloud Messaging and Apple Push Notification services.*
  - name: Senders
    description: |-
      *Use `Senders` to build the sending and receiving identities that represent your business and applications.*

      - For 'outbound' communications, it is used as the sender of the communication (`from` field).

      - For 'inbound' communications to your app (sent by a Profile/end-user), it is used as the recipient (`to` field).

      - A Sender represents existing inventory created and setup in other APIs, such as Phone Numbers.

      - Use `SenderPools` to organize your `Senders` into logical groups to build multi-channel identities
      with multiple types of communications addresses (phone numbers, short codes, email addresses).
  - name: SenderPools
    description: |-
      *Use `Senders` to build the sending and receiving identities that represent your business and applications.*

      - For 'outbound' communications, it is used as the sender of the communication (`from` field).

      - For 'inbound' communications to your app (sent by a Profile/end-user), it is used as the recipient (`to` field).

      - A Sender represents existing inventory created and setup in other APIs, such as Phone Numbers.

      - Use `SenderPools` to organize your `Senders` into logical groups to build multi-channel identities
      with multiple types of communications addresses (phone numbers, short codes, email addresses).
paths:
  /Emails:
    post:
      summary: Send Emails
      operationId: SendEmails
      description: This operation creates and sends out emails to the specified recipients.
      tags:
        - Emails
      responses:
        '202':
          description: The request was accepted and an Operation was created to track its progress. The response body contains the ID and link to the Operation resource.
          headers:
            Location:
              schema:
                $ref: '#/components/schemas/OperationLocation'
              description: |-
                The location (uri) of the Operation resource.
                Issue a GET request to this URI to retrieve the status of the Operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http202ResponseWithOperationBody'
              examples:
                SendEmailsAccepted:
                  summary: Send Emails request accepted
                  value:
                    operationId: comms_operation_01h9krwprkeee8fzqspvwy6nq8
                    operationLocation: https://comms.twilio.com/v1/Emails/Operations/comms_operation_01h9krwprkeee8fzqspvwy6nq8
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SendEmailsRequest
              type: object
              description: A request to send one or more Emails.
              properties:
                from:
                  title: SendEmailsRequestFrom
                  description: The sending identity to associate with the `Email`.
                  oneOf:
                    - $ref: '#/components/schemas/EmailAddressSender'
                    - $ref: '#/components/schemas/SenderIdSender'
                to:
                  title: SendEmailsRequestTo
                  type: array
                  description: A list of recipients to send the email(s) to.
                  items:
                    title: SendEmailsRecipient
                    oneOf:
                      - title: SendEmailsAddressRecipient
                        description: Specify a recipient using their email address and associated name.
                        type: object
                        properties:
                          address:
                            type: string
                            description: The email address of the person or entity.
                            format: email
                          name:
                            type: string
                            description: The name of the person or entity.
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - address
                      - title: SendEmailsProfileRecipient
                        type: object
                        description: Specify a recipient by their Twilio `Profile` identified by ID & Memory Store ID.
                        properties:
                          profileId:
                            $ref: '#/components/schemas/ProfileId'
                          memoryStoreId:
                            $ref: '#/components/schemas/MemoryStoreId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - profileId
                          - memoryStoreId
                      - title: SendEmailsAudienceRecipient
                        type: object
                        description: Specify recipients using a Twilio `Audience` identified by `Audience.Id`.
                        properties:
                          audienceId:
                            $ref: '#/components/schemas/AudienceId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - audienceId
                      - title: SendEmailsGroupRecipient
                        type: object
                        description: |-
                          A group recipient contains a list of recipients
                          and one set of personalization variables for the group.
                        properties:
                          group:
                            title: SendEmailsGroup
                            description: The group of recipients to send the email to.
                            type: array
                            items:
                              oneOf:
                                - $ref: '#/components/schemas/EmailAddress'
                                - $ref: '#/components/schemas/ProfileRecipient'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - group
                content:
                  title: SendEmailsRequestContent
                  description: |-
                    The content of the Email.
                    ***
                    * Use the [Liquid](https://shopify.github.io/liquid/) templating language for personalization in any text-based field.
                    * When using a templated content, use the `variables` field on each recipient to specify the values to substitute.
                    * For each variable you specify in your template, you should have a matching key in each recipient's `variables` object.
                    * When targeting `Profile` recipients, you may specify `variables` with values that reference stored traits, on the `Profile` -- for example: `${Twilio.Profile.dateLastPurchase}` `${Twilio.Profile.firstName}` or `${Twilio.Profile.myCustomField}`.
                  oneOf:
                    - $ref: '#/components/schemas/EmailHtmlContent'
                tags:
                  $ref: '#/components/schemas/Tags'
                schedule:
                  $ref: '#/components/schemas/Schedule'
                ipPoolName:
                  type: string
                  description: |-
                    The name of the IP Pool to use for sending Emails.

                    If not specified, all dedicated IPs associated with your
                    account will be considered for sending.

                    IP pools are only available to accounts with dedicated IPs.

                    This field can be templated with [Liquid](https://shopify.github.io/liquid/).
                    Specify `variables` with each recipient for personalization.
                  minLength: 2
                  maxLength: 64
              required:
                - from
                - to
                - content
            examples:
              SendSimpleEmail:
                summary: Send simple Email
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - address: bob@example.com
                      name: Bob Smith
                  content:
                    subject: 'Re: Wedding Cake'
                    text: Hey, the cake is ready.
                    html: <html><body>Hey, <br/><br/>Cake</b></body></html>
                    attachments: []
              SendToProfiles:
                summary: Send to multiple Profiles
                value:
                  from:
                    address: team@example-company.com
                    name: Example Company Team
                  to:
                    - profileId: mem_profile_01h9krwprkeee8fzqspvwy6nq8
                      memoryStoreId: mem_store_00000000000000000000000000
                    - profileId: mem_profile_01h9krwprkeee8fzqspvwy6nq8
                      memoryStoreId: mem_store_00000000000000000000000000
                  content:
                    subject: Wedding Cake
                    text: Hey you, your cake is ready.
                    html: <html><body>Hey you, your cake is ready.<br/><br/></body></html>
                    attachments: []
              SendToAudience:
                summary: Send to an Audience with personalization
                value:
                  from:
                    address: marketing@example-company.com
                    name: Example Company Marketing
                  to:
                    - audienceId: aud_audience_01h9krwprkeee8fzqspvwy6nq8
                      variables:
                        firstName: ${Twilio.Profile.firstName}
                        lastName: ${Twilio.Profile.lastName}
                  content:
                    subject: Special Offer Just for You!
                    text: 'Hi {{ firstName | default: ''Valued Customer'' }}, check out our latest deals.'
                    html: '<html><body>Hi {{ firstName | default: ''Valued Customer'' }}, check out our latest deals.<br/><br/></body></html>'
                    attachments: []
              SendFromToDirectEntitiesWithPersonalization:
                summary: Send from, to direct entities with personalization
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - address: jane.doe@example.com
                      variables:
                        firstName: Jane
                        lastName: Doe
                    - address: john.doe@example.com
                      variables:
                        firstName: John
                        lastName: Doe
                  content:
                    subject: Wedding Cake
                    text: 'Hey {{ firstName | default: ''there'' }} {{ lastName | default: '''' }}, your cake is ready.'
                    html: '<html><body>Hey {{ firstName | default: ''there'' }} {{ lastName | default: '''' }}, your cake is ready.<br/><br/></body></html>'
                    attachments: []
              SendToProfileWithPersonalization:
                summary: Send to Profile with Profile-referencing personalization
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - profileId: mem_profile_01h9krwprkeee8fzqspvwy6nq8
                      memoryStoreId: mem_store_00000000000000000000000000
                      variables:
                        name: ${Twilio.profile.firstName}
                  content:
                    subject: Wedding Cake
                    text: Hey {{ name }}, your cake is ready.
                    html: '<html><body>Hey, {{ name | default: ''there'' }}, your cake is ready.<br/><br/></body></html>'
                    attachments: []
              SendAScheduledEmail:
                summary: Send a scheduled Email
                value:
                  from:
                    address: support@example.company.io
                    name: Cool Co Support
                  to:
                    - name: John Dough
                      address: john.dough@examplemail.com
                  content:
                    subject: Wedding Cake
                    text: Hi Mr. Dough, your cake will be ready for pickup tomorrow morning. Thanks for your continued business, we've included a special treat for you!
                    html: <html><body>Hi Mr. Dough, your cake is ready.<br/><br/> <p>Thanks for your continued business, we've included a special treat for you!</p> </body></html>
                    attachments: []
                  schedule:
                    sendAt:
                      - '2023-12-15T14:15:22Z'
              SendWithCustomHeaders:
                summary: Send email with custom headers
                value:
                  from:
                    address: marketing@example.com
                    name: Marketing Team
                  to:
                    - address: customer@example.com
                      name: Valued Customer
                  content:
                    subject: Special Offer for You
                    html: <html><body><h1>Exclusive Deal!</h1><p>Check out our latest offers.</p></body></html>
                    text: Exclusive Deal! Check out our latest offers.
                    headers:
                      X-Campaign-ID: CAMPAIGN-2025-Q1
                      X-Customer-Segment: VIP
                      X-Priority: '1'
              SendWithIPPool:
                summary: Send email using dedicated IP pool
                value:
                  from:
                    address: alerts@example.com
                    name: Alert System
                  to:
                    - address: admin@example.com
                      name: System Administrator
                  content:
                    subject: System Alert - High Priority
                    html: <html><body><h1>Alert</h1><p>Immediate attention required.</p></body></html>
                  ipPoolName: transactionalPool
              SendTemplateWithHeadersAndIPPool:
                summary: Send template-based email with headers and IP pool
                value:
                  from:
                    address: newsletter@example.com
                    name: Newsletter Team
                  to:
                    - address: subscriber@example.com
                      name: John Subscriber
                      variables:
                        firstName: John
                  content:
                    subject: January Newsletter
                    html: '<html><body><h1>Newsletter</h1><p>Greetings {{ firstName | default: ''Subscribers'' }}, it''s January!</p></body></html>'
                    headers:
                      X-Newsletter-Edition: 2025-01
                      X-Subscriber-Tier: Premium
                  ipPoolName: marketingPool
                  tags:
                    campaign: monthlyNewsletter
                    edition: january_2025
    get:
      summary: List Emails
      operationId: ListEmails
      description: This operation fetches a paginated list of Emails.
      tags:
        - Emails
      parameters:
        - in: query
          name: operationId
          description: Filter to Emails created in a specific Operation.
          schema:
            $ref: '#/components/schemas/OperationId'
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
          description: Filter Emails created after the specified date and time.
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
          description: Filter Emails created before the specified date and time.
        - in: query
          name: profile
          description: Filter Emails sent or received by a specific Profile.
          schema:
            $ref: '#/components/schemas/ProfileId'
        - in: query
          name: status
          description: Filter Emails by Delivery Status.
          schema:
            $ref: '#/components/schemas/EmailStatus'
        - in: query
          name: tags
          description: |-
            Match emails by one or many tags. If more than one tag is specified in the query, the search will return emails that have all the tags.
            For Example: ``` GET /Emails?tags=ageGroup:20s;industry:engineering; ```
          schema:
            $ref: '#/components/schemas/TagsString'
        - in: query
          name: pageToken
          description: The token to retrieve the next page of results.
          schema:
            $ref: '#/components/schemas/PageToken'
        - in: query
          name: pageSize
          description: The number of resources to return in a page.
          schema:
            $ref: '#/components/schemas/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListEmailsResponse
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailMetadata'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
                required:
                  - emails
                  - pagination
              examples:
                ListOfEmails:
                  summary: List of Emails
                  value:
                    emails:
                      - id: comms_email_01h9krwprkeee8fzqspvwy6nq8
                        content:
                          subject: An Introduction
                          text: Hello, World!
                          html: <html><body>Hello, World!</body></html>
                          attachments: []
                        from:
                          address: support@example.com
                          name: Cool Support
                        to:
                          - address: janedoe@example.com
                            name: Jane Doe
                        status: DELIVERED
                        related: []
                        tags: {}
                        scheduledFor: null
                        createdAt: '2023-08-24T14:15:22Z'
                        updatedAt: '2023-08-24T14:15:22Z'
                        deletedAt: null
                      - id: comms_email_01h9krwprkeee8fzqspvwy6nq8
                        content:
