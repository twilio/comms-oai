              title: DeviceRegistrationRequest
              type: object
              properties:
                contact_id:
                  x-twilio-version: preview
                  $ref: '#/components/schemas/ContactId'
                  description: The ID of the contact to register the device to, if available.
                app_name:
                  description: |-
                    The name of the `App` to register the device for.

                    If the `app_name` does not match the name 
                      of any existing Push Notification `App`, the operation will fail.
                  allOf:
                    - $ref: '#/components/schemas/PushNotificationAppName'
                token:
                  type: string
                  description: The device token to register for push notifications.
                provider:
                  $ref: '#/components/schemas/PushNotificationProvider'
              required:
                - app_name
                - token
                - provider
