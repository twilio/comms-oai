openapi: 3.1.0
info:
  title: Twilio Communications API
  version: preview
  contact:
    name: Twilio
    url: https://www.twilio.com
  x-logo:
    url: /docs.svg
  description: A comprehensive communications API for connecting people through software.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://comms.twilio.com/preview
    description: Twilio Communications API preview
security:
  - account_id_auth_token: []
  - api_key_api_key_secret: []
tags:
  - name: Contacts
    description: |-
      *Use `Contacts` to build and maintain a reliable directory of customers
      with validated communications addresses and identity profiles.*
  - name: Audiences
    description: |-
      *Build up `Audiences` to broadcast communications to larger audiences*.

       - Leverage them with `Messages`, `Emails`, `PushNotifications`
          and `Communications`.
  - name: Messages
    description: |-
      *Use `Messages` to send and receive RCS, SMS and MMS, Group MMS, and WhatsApp messages.*

      *Send with precise control over every aspect of your message
       or let Twilio share control and up-level your messaging with data-driven optimizations.*

      Messages supports:
       - Sending a Message to a single recipient
       - Sending Messages to many recipients in a single request
       - Sending Group Messages to facilitate communication between multiple people
       - Sending to both stored Contacts and/or directly specified messaging addresses (e.g. phone number)
       - Sending Messages to Contacts with multiple communication addresses: Twilio will choose the best channel.
       - Sending Messages to stored Audiences with per-recipient content personalization
       - Sending Messages with templated content that reference attributes of your stored Contacts
       - Sending Messages with rich content
       - Sending Messages with automatic suppression based on a Contact's preferences
       - Sending Messages with shortened, branded links that support click tracking.
       - Sending Messages scheduled for future delivery.
       - Receiving inbound Messages sent to your Twilio phone numbers.
       - Maintaining history of distinct communication sessions including both inbound and outbound Messages.
  - name: Emails
    description: |-
      *Use `Emails` to send and receive email with Twilio SendGrid.*
      *Use `Domains` to verify ownership and configure DNS for your domain name for sending `Emails`.*
      *Use `Email Senders` to set up a default address and name to send 'from' and to enable
       email for sending with `Communications`.*

      Emails supports:
       - Sending an Email to a single recipient
       - Sending Emails to many recipients in a single request
       - Sending to both stored Contacts and/or directly specified email addresses
       - Sending Emails to stored Audiences with per-recipient content personalization
       - Sending Emails with merged content that reference attributes of your stored Contacts
       - Sending Emails with branded links that support click tracking.
       - Sending Emails scheduled for future delivery.
       - Receiving inbound Email replies and relaying the event to you for handling.
  - name: PushNotifications
    description: |-
      🚧 *Use `PushNotifications` to send push notifications to your mobile apps
      via Firebase Cloud Messaging and Apple Push Notification services
      as well as other push-enabled services.*
  - name: Agents
    description: |-
      *Use `Agents` to build the sending and receiving identities that represent your business and applications.*

      - For 'outbound' communications, it is used as the sender of the communication (`from` field).

      - For 'inbound' communications to your app (sent by a Contact/end-user), it is used as the recipient (`to` field).

      - An Agent represents existing inventory created and setup in other APIs, such as Phone Numbers.

      - Use `AgentPools` to organize your `Agents` into logical groups to build multi-channel identities
      with multiple types of communications addresses (phone numbers, short codes, email addresses).
  - name: AgentPools
    description: |-
      *Use `Agents` to build the sending and receiving identities that represent your business and applications.*

      - For 'outbound' communications, it is used as the sender of the communication (`from` field).

      - For 'inbound' communications to your app (sent by a Contact/end-user), it is used as the recipient (`to` field).

      - An Agent represents existing inventory created and setup in other APIs, such as Phone Numbers.

      - Use `AgentPools` to organize your `Agents` into logical groups to build multi-channel identities
      with multiple types of communications addresses (phone numbers, short codes, email addresses).
paths:
  /Contacts:
    post:
      summary: Create Contacts
      operationId: CreateContacts
      description: This operation creates Contacts. A contact must have at least one address or a user_identifier supplied in order to be created.
      tags:
        - Contacts
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithOperation'
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateContactsRequest
              type: object
              required:
                - contacts
              properties:
                contacts:
                  title: CreateContactsRequestContacts
                  type: array
                  items:
                    type: object
                    title: CreateContactsRequestContactsItem
                    description: Specify the Contact including their communications addresses and descriptors of their identity.
                    properties:
                      addresses:
                        type: array
                        description: The Contact’s communication addresses, such as phone number, email address, and push device token.
                        items:
                          $ref: '#/components/schemas/ContactAddress'
                      first_name:
                        type: string
                        description: The first name of the Contact.
                      last_name:
                        type: string
                        description: The last name of the Contact.
                      display_name:
                        type: string
                        description: |-
                          The name to associate with the address for sending and receiving communications,
                          visible for some types of communications like email.
                      user_identifier:
                        $ref: '#/components/schemas/UserIdentifier'
                      external_identifier:
                        $ref: '#/components/schemas/ExternalIdentifier'
                      location:
                        $ref: '#/components/schemas/ContactLocation'
                      date_of_birth:
                        description: Contact's date of birth.
                        format: YYYY-MM-DD
                        type: string
                      tags:
                        $ref: '#/components/schemas/Tags'
                      custom_fields:
                        $ref: '#/components/schemas/ContactCustomFields'
                  minItems: 1
            examples:
              CreateAContactWithAnEmailAddressPhoneNumberAndCustomFields:
                summary: Create a Contact with an email address, phone number and custom fields
                value:
                  contacts:
                    - first_name: Ivan
                      last_name: Lee
                      display_name: Ivan Lee
                      user_identifier: 3c35422849fea46d37b099ae59fae22c
                      external_identifier: 006E0000004TguX
                      addresses:
                        - channel: phone
                          address: '+37259000000'
                        - channel: email
                          address: ilee@example.com
                      custom_fields:
                        favorite_color:
                          value: purple
                        favorite_number:
                          value: 42
                        is_favorite_color_purple:
                          value: true
                        colors:
                          value:
                            - purple
                            - blue
                            - green
              CreateAContactWithAnEmailAddressAndPhoneNumber:
                summary: Create a Contact with an email address and phone number
                value:
                  contacts:
                    - first_name: Don
                      last_name: Conama
                      display_name: Don
                      user_identifier: '+37259000011'
                      external_identifier: 006E0000004TguX
                      addresses:
                        - channel: phone
                          address: '+37259000011'
                        - channel: email
                          address: don.conama@example.com
                      tags:
                        shirt_size: X-Large
              CreateAContactWithAPushDeviceTokenAndSmsAddressForAMobileApp:
                summary: Create a Contact with a push device token and sms address for a mobile app
                value:
                  contacts:
                    - first_name: David
                      last_name: Pletnjov
                      display_name: David Pletnjov
                      addresses:
                        - channel: push
                          address: comms_deviceregistrations_01h9krwprkeee8fzqspvwy6nq8
                        - channel: phone
                          address: '+37259000022'
              CreateAContactWithPushDeviceTokensFor2DifferentMobileApps:
                summary: Create a Contact with push device tokens for 2 different mobile apps
                value:
                  contacts:
                    - first_name: David
                      last_name: Pletnjov
                      display_name: David Pletnjov
                      addresses:
                        - channel: push
                          address: comms_deviceregistrations_01h9krwprkeee8fzqspvwy6nq8
                        - channel: push
                          address: comms_deviceregistrations_8fzqspvwy6nq801h9krwprkeee
    get:
      summary: List Contacts
      operationId: ListContacts
      description: This operation fetches a paginated list of Contacts.
      tags:
        - Contacts
      parameters:
        - in: query
          name: operation_id
          description: Filter to Contacts by operation ID.
          schema:
            $ref: '#/components/schemas/OperationId'
        - in: query
          name: contact_ids
          description: List of contact ids for filtering the contacts.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContactId'
            minItems: 1
            maxItems: 100
        - in: query
          name: page_token
          description: The token to retrieve the next page of results.
          schema:
            $ref: '#/components/schemas/PageToken'
        - in: query
          name: page_size
          description: The number of resources to return in a page.
          schema:
            $ref: '#/components/schemas/PageSize'
        - in: query
          name: tags
          description: |-
            Match contacts by one or many tags. If more than one tag is specified in the query, the search will return contacts that have all the tags.
            For Example:  ``` GET /Contacts?tags=age_group:20s;industry:engineering; ```
          schema:
            $ref: '#/components/schemas/TagsString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListContactsResponse
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
                required:
                  - contacts
                  - pagination
              examples:
                FirstPageOfContactsForListReadWithNoFilter:
                  summary: First page of Contacts for list read with no filter
                  value:
                    contacts:
                      - id: comms_contact_01h9krwprkeee8fzqspvwy6nq8
                        first_name: Jane
                        last_name: Doe
                        display_name: Jane Doe
                        user_identifier: 3c35422849fea46d37b099ae59fae22c
                        external_identifier: 006E0000004TguX
                        addresses:
                          - channel: email
                            address: janedoe@example.com
                        created_at: '2022-08-24T14:15:22Z'
                        updated_at: '2023-09-13T12:00:24Z'
                        deleted_at: null
                      - id: comms_contact_01h9krwprkeee8fzqspvwy6nq8
                        first_name: Don
                        last_name: Conama
                        related:
                          - name: operation
                            id: comms_operation_01h9krwprkeee8fzqspvwy6nq8
                            uri: /Contacts/Operations/comms_operation_01h9krwprkeee8fzqspvwy6nq8
                        display_name: Don Conama
                        user_identifier: don.conama@example.com
                        external_identifier: 006E0000004TguX
                        addresses:
                          - channel: email
                            address: don.conama@example.com
                        created_at: '2019-08-24T14:15:22Z'
                        updated_at: '2023-08-24T14:15:22Z'
                        deleted_at: null
                        custom_fields:
                          favorite_color:
                            value: purple
                          favorite_number:
                            value: 42
                          is_favorite_color_purple:
                            value: true
                    pagination:
                      next: page_01h9krwprkeee8fzqspvwy6nq9
                      self: https://comms.twilio.com/v1/Contacts
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
  /Contacts/{contact_id}:
    parameters:
      - schema:
          $ref: '#/components/schemas/ContactId'
        name: contact_id
        in: path
        required: true
    get:
      summary: Fetch a Contact
      operationId: FetchSingleContact
      description: This operation fetches a single contact using its ID.
      tags:
        - Contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                FetchContact:
                  summary: Fetch Contact
                  value:
                    id: comms_contact_01h9krwprkeee8fzqspvwy6nq8
                    first_name: Ivan
                    last_name: Lee
                    display_name: Ivan Lee
                    user_identifier: 3c35422849fea46d37b099ae59fae22c
                    external_identifier: 006E0000004TguX
                    addresses:
                      - channel: phone
                        address: '+37259000000'
                      - channel: email
                        address: ilee@example.com
                      - channel: push
                        address: limonade_app
                    created_at: '2019-08-24T14:15:22Z'
                    updated_at: '2023-10-02T11:20:00Z'
                    deleted_at: null
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
    patch:
      summary: Update a Contact
      operationId: UpdateContact
      description: This operation partially updates a Contact
      tags:
        - Contacts
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithResource'
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UpdateContactRequest
              type: object
              nullable: true
              properties:
                first_name:
                  description: The first name of the Contact.
                  type: string
                last_name:
                  description: The last name of the Contact.
                  type: string
                display_name:
                  type: string
                  description: The name associated with the address for sending and receiving communications, visible for some types of communications like email.
                addresses:
                  title: UpdateContactAddresses
                  description: |-
                    This replaces the `addresses` array. 
                    Leave `null` to leave addresses unchanged.
                    Set to empty array to remove all addresses.
                    To add/remove individual addresses use the Contact Addresses API endpoints.
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/ContactAddress'
                tags:
                  $ref: '#/components/schemas/TagsNullable'
                custom_fields:
                  $ref: '#/components/schemas/ContactCustomFieldsNullable'
            examples:
              UpdateContactAddresses:
                summary: Update Contact addresses
                value:
                  addresses:
                    - channel: phone
                      address: '+37259000000'
                    - channel: email
                      address: ipletnjov@example.com
              UpdateContactTags:
                summary: Update Contact tags
                value:
                  tags:
                    shirt_size: X-Large
              UpdateContactCustomFields:
                summary: Update Contact custom fields
                value:
                  custom_fields:
                    favorite_color:
                      value: purple
                    favorite_number:
                      value: 42
                    is_favorite_color_purple:
                      value: true
                    colors:
                      value:
                        - purple
                        - blue
                        - green
    delete:
      summary: Delete a Contact
      operationId: DeleteContact
      description: This operation deletes a Contact
      tags:
        - Contacts
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithResource'
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
  /Contacts/{contact_id}/Addresses:
    parameters:
      - schema:
          $ref: '#/components/schemas/ContactId'
        name: contact_id
        in: path
        required: true
    get:
      summary: List of Contact Addresses
      operationId: ListContactAddresses
      description: This operation fetches list of contact addresses
      tags:
        - Contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListContactAddressesResponse
                type: object
                properties:
                  addresses:
                    title: ListContactAddressesResponseAddresses
                    description: List of the provided `Contact`'s communication addresses
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactAddress'
                required:
                  - addresses
              examples:
                ListOfContactAddresses:
                  summary: List of contact addresses
                  value:
                    addresses:
                      - channel: email
                        address: beetlejuice@example.com
                      - channel: phone
                        address: '+37259000000'
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
    post:
      summary: Add Addresses to the Contact
      operationId: AddContactAddresses
      description: This operation adds addresses to the contact
      tags:
        - Contacts
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithResource'
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AddContactAddressesRequest
              type: object
              properties:
                addresses:
                  title: AddContactAddressesRequestAddresses
                  description: A list of communication addresses to add to the `Contact`
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactAddress'
                  minItems: 1
              required:
                - addresses
            examples:
              AddAddressesToTheContact:
                summary: Add addresses to the Contact
                value:
                  addresses:
                    - channel: phone
                      address: '+37259000000'
              AddMultipleAddressesToTheContact:
                summary: Add multiple addresses to the Contact
                value:
                  addresses:
                    - channel: phone
                      address: '+37259000000'
                    - channel: push
                      address: limonade_app
    delete:
      summary: Delete Addresses from the Contact
      operationId: DeleteContactAddresses
      description: This operation deletes Contact Addresses
      tags:
        - Contacts
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithResource'
        '400':
          $ref: '#/components/responses/Http400Response'
        '404':
          $ref: '#/components/responses/Http404Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: DeleteContactAddressesRequest
              type: object
              properties:
                addresses:
                  title: DeleteContactAddressesRequestAddresses
                  type: array
                  items:
                    title: DeleteContactAddressesRequestAddressItem
                    type: object
                    description: A list of communication addresses to remove from the `Contact`
                    properties:
                      channel:
                        $ref: '#/components/schemas/ContactCommunicationChannel'
                      address:
                        $ref: '#/components/schemas/Address'
                  minItems: 1
              required:
                - addresses
            examples:
              DeleteContactPhoneAddress:
                summary: Delete Contact phone address
                value:
                  addresses:
                    - channel: phone
                      address: '+37259000000'
              DeleteAllContactEmailAddresses:
                summary: Delete all email addresses for Contact
                value:
                  addresses:
                    - channel: email
  /Contacts/{contact_id}/Tags:
