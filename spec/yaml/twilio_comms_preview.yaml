  /Audiences:
    post:
      summary: Create an Audience
      operationId: CreateAudience
      description: |-
        This operation creates an Audience. There are three different types of audiences.
        - **Static Audience** - This is the standard type of audience. It is created with a name,
          optionally some tags and then Contacts are manually added or removed from it.

        - **Dynamic Audience** - This is an audience whose Contact list is made up based upon a filter.
          The filter is required and the results of the filter are the audience. It is not possible to
          manually add/remove contacts to this audience. When you go to list the contacts on this
          audience they are a close-to-real-time representation of the results of the filter. This means
          that if the audience has a filter where  `favorite_color = 'purple'` and that field is set
          on a new contact it should appear in the audience as soon as possible. The filter for this
          audience is saved on the audience and can be viewed from the API.

          Filters can contain the standard fields: `created_at`, `updated_at`, `addresses.channel`, `location.city`,
          `location.state`, `location.country_code`. Filters can also check for the presence of tags by key
          `Contact.tags = 'NAMER'`, and they can use custom fields that are marked as `is_filterable = true`.


        - **Snapshot Audience** - This behaves like the default audience after it has been created, but
          it allows for a powerful way to pre-populate the audience with contacts upon creation.
          This is done by providing a filter when creating the audience and setting the snapshot field
          to true. The contacts that match the filter will be added to the list, but if a contact matches
          later to the filter it will need to be added manually. Contacts can be added and removed manually
          to the list after they have been created. The filter for this audience is not saved on the audience
          as it is a one time operation.

          Filters can contain the standard fields: `created_at`, `updated_at`, `addresses.channel`, `location.city`,
          `location.state`, `location.country_code`. Filters can also check for the presence of tags by key
          `Contact.tags = 'NAMER'`, and they can use custom fields that are marked as `is_filterable = true`.
      tags:
        - Audiences
      responses:
        '202':
          $ref: '#/components/responses/Http202ResponseWithOperation'
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateAudienceRequest
              type: object
              description: This operation creates Audiences.
              properties:
                name:
                  type: string
                  description: A name for the Audience.
                filter:
                  $ref: '#/components/schemas/AudienceFilter'
                snapshot:
                  type: boolean
                  description: |-
                    If true, the Audience will be created with the current Contacts that match the filter.
                    *The audience will not be updated as contacts change in the future and the filter is not saved for reference later.*
                tags:
                  x-twilio-version: preview
                  $ref: '#/components/schemas/Tags'
              required:
                - name
            examples:
              CreateAudience:
                summary: Create Audience
                value:
                  name: FB Lead Ads - New Sign Ups
                  tags:
                    campaign: fb-leads-ad-7
    get:
      summary: List Audiences
      operationId: ListAudiences
      description: This operation fetches a paginated list of Audiences.
      tags:
        - Audiences
      parameters:
        - in: query
          name: operation_id
          description: Filter to Audiences by operation ID.
          schema:
            $ref: '#/components/schemas/OperationId'
        - in: query
          name: page_token
          description: The token to retrieve the next page of results.
          schema:
            $ref: '#/components/schemas/PageToken'
        - in: query
          name: page_size
          description: The number of resources to return in a page.
          schema:
            $ref: '#/components/schemas/PageSize'
        - in: query
          name: tags
          description: |-
            Match audiences by one or many tags. If more than one tag is specified in the query, the search will return audiences that have all the tags.
            For example: ``` GET /Audiences?tags=age_group:20s;industry:engineering; ```
          schema:
            $ref: '#/components/schemas/TagsString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListAudiencesResponse
                type: object
                properties:
                  audiences:
                    type: array
                    items:
                      $ref: '#/components/schemas/Audience'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
                required:
                  - audiences
                  - pagination
              examples:
                ListAudiences:
                  summary: List Audiences
                  value:
                    audiences:
                      - id: comms_audience_01h9krwprkeee8fzqspvwy6nq8
                        name: Repeat Buyers
                        total_contacts: 1337
                        tags:
                          country_code: US
                        created_at: '2023-08-24T14:15:22Z'
                        updated_at: '2023-08-24T14:15:22Z'
                        deleted_at: null
                      - id: comms_audience_01h9krwprkeee8fzqspvwy6nq9
                        name: Technology & Finance Contacts
                        total_contacts: 78
                        filter: Contact.location.country_code == 'US' AND Contact.custom_fields.industry IN('Technology', 'Finance')
                        tags: {}
                        created_at: '2023-08-24T14:15:22Z'
