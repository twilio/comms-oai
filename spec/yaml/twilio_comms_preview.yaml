      operationId: SendMessages
      description: This operation creates and sends out messages to the specified recipients.
      tags:
        - Messages
      responses:
        '202':
          description: The request was accepted and an Operation was created to track its progress. The response body contains the ID and link to the Operation resource.
          headers:
            Location:
              schema:
                $ref: '#/components/schemas/OperationLocation'
              description: |-
                The location (uri) of the Operation resource.
                Issue a GET request to this URI to retrieve the status of the Operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http202ResponseWithOperationBody'
              examples:
                SendMessagesAccepted:
                  summary: Send Messages request accepted
                  value:
                    operationId: comms_operation_01h9krwprkeee8fzqspvwy6nq8
                    operationLocation: https://comms.twilio.com/v1/Messages/Operations/comms_operation_01h9krwprkeee8fzqspvwy6nq8
        '400':
          $ref: '#/components/responses/Http400Response'
        '429':
          $ref: '#/components/responses/Http429Response'
        '500':
          $ref: '#/components/responses/Http500Response'
        '503':
          $ref: '#/components/responses/Http503Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SendMessagesRequest
              type: object
              properties:
                to:
                  title: SendMessagesRequestTo
                  description: An array of recipient objects to send the Message(s) to.
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    title: SendMessagesRecipient
                    oneOf:
                      - type: object
                        title: SendMessagesAddressRecipient
                        description: Describe the recipient by their address and channel.
                        properties:
                          address:
                            type: string
                            description: The recipient’s communication address within a channel, e.g. phone number
                          channel:
                            $ref: '#/components/schemas/MessageAddressChannel'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - address
                          - channel
                        additionalProperties: false
                      - type: object
                        title: SendMessagesConnectedAddressRecipient
                        description: |-
                          Provide a list of addresses for a recipient and Twilio will pick the best
                          one. 

                          Twilio will automatically handle errors and retry across channels when necessary.
                        properties:
                          addresses:
                            type: array
                            items:
                              $ref: '#/components/schemas/MessageAddress'
                            minItems: 1
                            maxItems: 10
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - addresses
                      - type: object
                        title: SendMessagesProfileRecipient
                        description: Describe your recipient by their Twilio `Profile` identified by `Profile.Id`.
                        properties:
                          profileId:
                            $ref: '#/components/schemas/ProfileId'
                          memoryStoreId:
                            $ref: '#/components/schemas/MemoryStoreId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - profileId
                          - memoryStoreId
                      - type: object
                        title: SendMessagesAudienceRecipient
                        description: Describe your recipients using a Twilio `Audience` identified by `Audience.Id`.
                        properties:
                          audienceId:
                            $ref: '#/components/schemas/AudienceId'
                          variables:
                            $ref: '#/components/schemas/ContentPersonalization'
                        required:
                          - audienceId
                content:
                  title: SendMessagesRequestContent
                  type: object
                  description: |-
                    The content of the Message.

                    ***

                    * Use the [Liquid](https://shopify.github.io/liquid/)
                    templating language for personalization in any text-based field.

                    * When using a templated content,
                    use the `variables` field on each recipient to specify
                    the values to substitute.

                    * For each variable you specify in your template, you should have
                    a matching key in each recipient's `variables` object.

                    * When targeting `Audience` or `Profile` recipients, you may specify `variables`
                    with values that reference stored traits on the `Profile` -- for example:
                    `${Twilio.Profile.firstName}` or `${Twilio.Profile.myCustomField}`.
